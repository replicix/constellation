# Reproducible test infrastructure.
#
#   docker compose up -d --wait floci          # S3 backend only (host tests)
#   tests/compose-test.sh                      # fully containerized run
#
# Floci (https://github.com/floci-io/floci) provides the S3-compatible
# backend: MIT-licensed, no auth token, LocalStack-compatible wire
# protocol and init hooks. The `smoke` service runs the complete
# integration test — including the FUSE mount itself — inside a
# container, so the whole suite is reproducible locally and in CI.
services:
  floci:
    # -compat variant ships the AWS CLI, needed by the bucket init hook.
    image: floci/floci:1.7.0-compat
    ports:
      - "4566:4566"
    environment:
      - FLOCI_STORAGE_MODE=memory
    # SELinux hosts (Fedora/RHEL): the init hook below is a bind mount of
    # the source tree, which container_t may not read, so floci exits 126
    # at startup. Disabling the label beats `:z`, which would relabel the
    # checkout on the host. A no-op where SELinux is off (Ubuntu CI).
    security_opt:
      - label:disable
    volumes:
      # LocalStack-compatible init path, honored by floci.
      - ./tests/docker/floci-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  smoke: &suite
    image: ${SMOKE_IMAGE:-constellation-smoke:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: suite
      args:
        TARGET_CACHE_ID: constellation-target-${COMPOSE_PROJECT_NAME}
    profiles: ["test"]
    depends_on:
      floci:
        condition: service_healthy
    # FUSE inside a container: the fuse device, mount capability, an
    # unconfined apparmor profile (mount is otherwise denied), and no
    # SELinux label: container_t may not create device nodes on a FUSE
    # mount, so pjdfstest's `mknod b/c` gets EACCES and 1798 checks
    # cascade. Both options are no-ops where that LSM is not enabled.
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - label:disable
    environment: &suite-env
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://floci:4566
      AWS_ALLOW_HTTP: "true"
    command: ["smoke"]

  # POSIX compliance (pjdfstest vs. tests/pjdfstest-baseline.txt).
  compliance:
    <<: *suite
    command: ["compliance"]

  # The same pjdfstest run on plan 38's ring transport
  # (`CONSTELLATION_FUSE_TRANSPORT=uring`: the ladder for every plain mount,
  # including this one, which has cluster locks and which `auto` would keep
  # on `/dev/fuse` since plan 38 Z2c), so POSIX compliance is gated on
  # every transport and not only on `/dev/fuse` (plan 38 §6: "pjdfstest
  # 8798/8798 on every transport"). The image is the suite's own: Linux
  # builds of `constellation` carry the `io-uring` feature since Z2c. What
  # the default container does not have is `seccomp:unconfined`: Docker's
  # default seccomp profile blocks `io_uring_setup(2)`, `io_uring_enter(2)`
  # and `io_uring_register(2)` outright, and a blocked setup is invisible
  # in sysfs — the mount would quietly fall back to `/dev/fuse` and the
  # lane would pass while testing nothing (plan 38 §8; `tests/compliance.sh`
  # prints the transport it got). It is set *only* here, never on the
  # `smoke`/`compliance`/`stress` services, whose point is to run under an
  # ordinary container profile.
  #
  # The host kernel decides the rest: 6.14+ with `fuse.enable_uring=Y`.
  # On a host without it the leg still runs and still has to pass, on the
  # `/dev/fuse` fallback — which is the ladder's own promise.
  #
  #   docker compose --profile test-uring run --rm compliance-uring
  #   make compliance-uring
  compliance-uring:
    <<: *suite
    profiles: ["test-uring"]
    security_opt:
      - apparmor:unconfined
      - label:disable
      - seccomp:unconfined
    environment:
      <<: *suite-env
      CONSTELLATION_FUSE_TRANSPORT: uring
    command: ["compliance"]

  # Data-integrity (fio verify) + metadata churn (stress-ng).
  stress:
    <<: *suite
    command: ["stress"]

  # Full generic xfstests sweep, nightly/manual only.
  xfstests:
    <<: *suite
    image: ${XFSTESTS_IMAGE:-constellation-xfstests:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: xfstests-runner
      args:
        TARGET_CACHE_ID: constellation-target-${COMPOSE_PROJECT_NAME}
    command: []

  # Fault-injection harness, fully containerized: only docker is needed
  # on the host. The harness drives the host docker daemon through the
  # mounted socket (floci/toxiproxy run as sibling containers) and runs
  # the FUSE mounts inside this container. Host networking keeps the
  # sibling containers' published 127.0.0.1 ports reachable.
  harness:
    image: ${HARNESS_IMAGE:-constellation-harness:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: harness
      args:
        TARGET_CACHE_ID: constellation-target-${COMPOSE_PROJECT_NAME}
    profiles: ["test"]
    network_mode: host
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    # Same FUSE confinement as the suite; without a label the container
    # may also use the host's docker socket.
    security_opt:
      - apparmor:unconfined
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["run"]
