# Reproducible test infrastructure.
#
#   docker compose up -d --wait floci          # S3 backend only (host tests)
#   tests/compose-test.sh                      # fully containerized run
#
# Floci (https://github.com/floci-io/floci) provides the S3-compatible
# backend: MIT-licensed, no auth token, LocalStack-compatible wire
# protocol and init hooks. The `smoke` service runs the complete
# integration test — including the FUSE mount itself — inside a
# container, so the whole suite is reproducible locally and in CI.
services:
  floci:
    # -compat variant ships the AWS CLI, needed by the bucket init hook.
    image: floci/floci:1.7.0-compat
    ports:
      - "4566:4566"
    environment:
      - FLOCI_STORAGE_MODE=memory
    volumes:
      # LocalStack-compatible init path, honored by floci.
      - ./tests/docker/floci-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  smoke: &suite
    image: ${SMOKE_IMAGE:-constellation-smoke:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: suite
    profiles: ["test"]
    depends_on:
      floci:
        condition: service_healthy
    # FUSE inside a container: the fuse device, mount capability, and an
    # unconfined apparmor profile (mount is otherwise denied).
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment: &suite-env
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://floci:4566
      AWS_ALLOW_HTTP: "true"
    command: ["smoke"]

  # POSIX compliance (pjdfstest vs. tests/pjdfstest-baseline.txt).
  compliance:
    <<: *suite
    command: ["compliance"]

  # The same pjdfstest run on plan 38's transport ladder
  # (`CONSTELLATION_FUSE_TRANSPORT=auto`), so POSIX compliance is gated on
  # every transport and not only on `/dev/fuse` (plan 38 §6: "pjdfstest
  # 8798/8798 on every transport"). Its own image and its own profile,
  # because reaching the ring needs two things the default suite image and
  # the default container do not have:
  #
  #  * the `io-uring` cargo feature in the binary (`CARGO_FEATURES` below);
  #  * `seccomp:unconfined`. Docker's default seccomp profile blocks
  #    `io_uring_setup(2)`, `io_uring_enter(2)` and `io_uring_register(2)`
  #    outright, and a blocked setup is invisible in sysfs — the mount
  #    would quietly fall back to `/dev/fuse` and the lane would pass
  #    while testing nothing (plan 38 §8). It is set *only* here, never on
  #    the `smoke`/`compliance`/`stress` services, whose point is to run
  #    under an ordinary container profile.
  #
  # The host kernel decides the rest: 6.14+ with `fuse.enable_uring=Y`.
  # On a host without it the leg still runs and still has to pass, on the
  # `/dev/fuse` fallback — which is the ladder's own promise.
  #
  #   docker compose --profile test-uring run --rm compliance-uring
  #   make compliance-uring
  compliance-uring:
    <<: *suite
    image: ${SUITE_URING_IMAGE:-constellation-suite-uring:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: suite
      args:
        CARGO_FEATURES: constellation-frontend-fuse/io-uring
    profiles: ["test-uring"]
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    environment:
      <<: *suite-env
      CONSTELLATION_FUSE_TRANSPORT: auto
    command: ["compliance"]

  # Data-integrity (fio verify) + metadata churn (stress-ng).
  stress:
    <<: *suite
    command: ["stress"]

  # Full generic xfstests sweep, nightly/manual only.
  xfstests:
    <<: *suite
    image: ${XFSTESTS_IMAGE:-constellation-xfstests:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: xfstests-runner
    command: []

  # Fault-injection harness, fully containerized: only docker is needed
  # on the host. The harness drives the host docker daemon through the
  # mounted socket (floci/toxiproxy run as sibling containers) and runs
  # the FUSE mounts inside this container. Host networking keeps the
  # sibling containers' published 127.0.0.1 ports reachable.
  harness:
    image: ${HARNESS_IMAGE:-constellation-harness:local}
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
      target: harness
    profiles: ["test"]
    network_mode: host
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["run"]
