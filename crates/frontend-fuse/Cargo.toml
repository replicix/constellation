[package]
name = "constellation-frontend-fuse"
description = "The Linux (FreeBSD-ready) FUSE frontend (plan 31 §4): fuser's callbacks translated into `constellation-vfs` ops and their responders back into fuser replies; the only crate that depends on fuser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
constellation-vfs.workspace = true
constellation-types.workspace = true
constellation-platform.workspace = true
# `serializable`: `NegotiatedInit` crosses processes in a session handover.
fuser = { workspace = true, features = ["serializable"] }
libc.workspace = true
tracing.workspace = true

[features]
# Plan 38 Z1a: forwards to the vendored fuser's FUSE-over-io_uring
# transport. Off by default -- and even with it on, no mount asks for the
# ring unless `MountOptions::io_uring` (or Z1a's `CONSTELLATION_FUSE_URING`
# test hook) says so, so the workspace default stays `/dev/fuse`.
io-uring = ["fuser/io-uring"]

[dev-dependencies]
# `MockVfs` (tests/wire.rs): the adapter driven by a fake kernel over a
# socket pair, against a recording, scriptable `Vfs`.
constellation-vfs = { workspace = true, features = ["mock"] }
# The handover tests (`session.rs`): a mountpoint, the wire round trips.
tempfile.workspace = true
serde_json.workspace = true
postcard.workspace = true
