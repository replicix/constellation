[package]
name = "constellation-chaos"
description = "Multi-node FS consistency stress tool (CI local + remote soak)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "constellation_chaos"
path = "src/lib.rs"

[[bin]]
name = "chaos"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
constellation-types.workspace = true
blake3.workspace = true
clap.workspace = true
libc.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
