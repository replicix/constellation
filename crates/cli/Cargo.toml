[package]
name = "constellation"
description = "Constellation CLI and daemon host, with the FUSE frontend (single binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "constellation"
path = "src/main.rs"

[dependencies]
constellation-engine.workspace = true
constellation-vfs.workspace = true
constellation-frontend-fuse.workspace = true
constellation-fs-core.workspace = true
constellation-types.workspace = true
constellation-platform.workspace = true
blake3.workspace = true
constellation-authority.workspace = true
constellation-meta.workspace = true
constellation-mtree.workspace = true
constellation-control = { workspace = true, features = ["web"] }
futures.workspace = true
constellation-net.workspace = true
constellation-store-s3.workspace = true
anyhow.workspace = true
jiff.workspace = true
clap.workspace = true
libc.workspace = true
object_store.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7.5.4"
zeroize = "1.9.0"

[dev-dependencies]
constellation-engine = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
