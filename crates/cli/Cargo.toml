[package]
name = "constellation"
description = "Constellation CLI, daemon, and FUSE mount (single binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "constellation"
path = "src/main.rs"

[dependencies]
constellation-fs-core.workspace = true
blake3.workspace = true
constellation-authority.workspace = true
constellation-meta.workspace = true
constellation-mtree.workspace = true
constellation-api = { workspace = true, features = ["web"] }
constellation-net.workspace = true
constellation-upload-concurrency.workspace = true
constellation-store-s3.workspace = true
fjall = { version = "3.1", package = "fjall" }
anyhow.workspace = true
clap.workspace = true
fuser.workspace = true
libc.workspace = true
object_store.workspace = true
postcard.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
rpassword = "7.5.4"
zeroize = "1.9.0"
# The object store's trait is an `async_trait` (`backend::CountingStore`).
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
futures = "0.3"
