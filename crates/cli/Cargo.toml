[package]
name = "constellation"
description = "Constellation CLI, daemon, and FUSE mount (single binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "constellation"
path = "src/main.rs"

[dependencies]
constellation-fs-core.workspace = true
constellation-meta.workspace = true
constellation-api = { workspace = true, features = ["web"] }
constellation-net.workspace = true
constellation-store-s3.workspace = true
anyhow.workspace = true
clap.workspace = true
fuser.workspace = true
libc.workspace = true
object_store.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
rpassword = "7.5.4"
zeroize = "1.9.0"

[dev-dependencies]
tempfile.workspace = true
async-trait = "0.1"
futures = "0.3"
