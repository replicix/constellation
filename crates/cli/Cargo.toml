[package]
name = "constellation"
description = "Constellation CLI and daemon host, with the FUSE frontend (single binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "constellation"
path = "src/main.rs"

[dependencies]
constellation-engine.workspace = true
constellation-vfs.workspace = true
constellation-frontend-fuse.workspace = true
constellation-fs-core.workspace = true
constellation-types.workspace = true
constellation-platform.workspace = true
blake3.workspace = true
constellation-authority.workspace = true
constellation-meta.workspace = true
constellation-mtree.workspace = true
constellation-control = { workspace = true, features = ["web"] }
futures.workspace = true
constellation-net.workspace = true
constellation-store-s3.workspace = true
anyhow.workspace = true
jiff.workspace = true
clap.workspace = true
libc.workspace = true
object_store.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7.5.4"
zeroize = "1.9.0"

# Plan 38 Z2c: Linux builds of the binary carry the FUSE-over-io_uring
# transport, so the one binary runs plan 38 §2.4's runtime ladder on every
# kernel (the ring where 6.14+ with `fuse.enable_uring=Y` and the sandbox
# grant it, `/dev/fuse` elsewhere) instead of leaving it to a build flag.
# Linux-only: other targets (`dist-macos`) build the frontend as before.
[target.'cfg(target_os = "linux")'.dependencies]
constellation-frontend-fuse = { workspace = true, features = ["io-uring"] }

[dev-dependencies]
constellation-engine = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
