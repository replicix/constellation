[package]
name = "constellation-harness"
description = "Fault-injection and distributed test harness (not shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "constellation_harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
constellation-chaos.workspace = true
# Plan 30 §M4: decode log segments' records (the chaos scenarios' log-level
# exactly-once check reads every `Completed { rid }` in the bucket).
constellation-meta.workspace = true
fjall = { version = "3.1", package = "fjall" }
libc.workspace = true
postcard.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "2", features = ["json"] }
zstd.workspace = true

[dev-dependencies]
# `tests/s3_cut_heal.rs`: the daemons' own S3 client through the counting
# relay, across a cut and a heal.
constellation-store-s3.workspace = true
object_store.workspace = true
tokio.workspace = true
