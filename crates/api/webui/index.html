<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constellation</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0b1020;color:#dbe4ff}*{box-sizing:border-box}
body{margin:0}header{padding:18px 24px;border-bottom:1px solid #26304d;display:flex;justify-content:space-between}
main{max-width:1400px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
section{background:#111831;border:1px solid #26304d;border-radius:10px;padding:16px;min-height:120px}
h1{margin:0;font-size:20px}h2{margin:0 0 12px;color:#8eb7ff;font-size:16px}pre{white-space:pre-wrap;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #26304d}
button,input{background:#182344;color:inherit;border:1px solid #3c4c78;border-radius:5px;padding:7px;margin:2px}
button{cursor:pointer}.ok{color:#72e6a3}.bad{color:#ff8f9c}.wide{grid-column:1/-1}.muted{color:#8e9abb}
.clickable{cursor:pointer}section.clickable h2::after{content:" →";color:#8eb7ff;font-weight:400}
</style>
</head>
<body><header><h1>Constellation control plane</h1><span id="health">connecting…</span></header>
<main>
<section><h2>Dashboard</h2><div id="dashboard"></div></section>
<section class="clickable" onclick="if(!event.target.closest('a'))location.href='/peers.html'" title="Open peer details"><h2>Peers</h2><div id="peers"></div></section>
<section><h2>Cache</h2><div id="cache"></div></section>
<section><h2>Leases / partitions</h2><div id="leases"></div></section>
<section class="wide"><h2>Files</h2><input id="path" value="/" aria-label="path"><button onclick="browse()">Browse</button><div id="files"></div></section>
<section><h2>Snapshots</h2><input id="snap" placeholder="/path@name"><button onclick="snapCreate()">Create</button><div id="snapshots"></div></section>
<section><h2>Ops</h2><button onclick="doctor()">Doctor</button><button onclick="logs()">Refresh logs</button><pre id="ops"></pre></section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const call=async req=>(await fetch("/api",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(req)})).json();
const bytes=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KiB":(n/1048576).toFixed(1)+" MiB";
/** Format a millisecond duration with a unit that matches its scale. */
function dur(ms,{ago=false}={}){
 if(ms==null||ms==="")return"—";
 const n=Number(ms); if(!Number.isFinite(n))return"—";
 const a=Math.abs(n); let s;
 if(a<1)s=(a*1000).toFixed(0)+" µs";
 else if(a<1000)s=(Number.isInteger(a)?a:a.toFixed(0))+" ms";
 else if(a<60e3)s=(a/1e3).toFixed(a<10e3?2:1)+" s";
 else if(a<3600e3)s=(a/60e3).toFixed(a<600e3?1:0)+" min";
 else if(a<86400e3)s=(a/3600e3).toFixed(1)+" h";
 else s=(a/86400e3).toFixed(1)+" d";
 return ago?s+" ago":s;
}
let refreshing=false;
async function refresh(){
 if(refreshing)return; refreshing=true;
 try{let r=await(await fetch("/api/status")).json(),s=r.Status||r.status||r; if(r.resp==="status")s=r;
 document.querySelector("#health").innerHTML='<span class="ok">healthy</span> · '+esc(s.fs_uuid);
 dashboard.innerHTML=`node <b>${s.node_id}</b> · uptime ${dur((s.uptime_s||0)*1000)}<br>${esc(s.backend)}<br>head ${s.spool.head_seq} · backlog ${s.spool.journal_backlog}<br>${s.spool.last_ship_error?'<span class="bad">'+esc(s.spool.last_ship_error)+'</span>':'sync healthy'}<br>epoch ${s.epoch.active?esc(s.epoch.epoch_id):"inactive"} · designations ${s.designations.length}`;
 peers.innerHTML=(s.p2p.peers||[]).map(p=>`<a href="/peers.html#node-${p.node_id}">node ${p.node_id}</a>: ${p.connected?'<span class="ok">connected</span>':'disconnected'} · RTT ${dur(p.rtt_ms)} · seen ${dur(p.last_seen_ms,{ago:true})}${p.hostname?' · '+esc(p.hostname):''}`).join("<br>")||'<span class="muted">no peers</span>';
 cache.innerHTML=`${bytes(s.cache.used_bytes)} / ${bytes(s.cache.budget_bytes)} · ${s.cache.chunks} chunks<br>pinned ${bytes(s.cache.pinned_bytes||0)}<br>peer hits ${s.coop.peer_hits} · S3 ${s.coop.s3_fetches} · hedges ${s.coop.hedges_fired}<br>`+(s.coop.per_source||[]).map(x=>`${esc(x.id)}: ${dur(x.ttfb_ms_ewma)}, ${x.goodput_mbps_ewma.toFixed(1)} Mbps, ${(x.err_rate*100).toFixed(1)}% err`).join("<br>");
 leases.innerHTML=(s.partitions||[]).map(p=>`${esc(p.id)} ${esc(p.root_path)} · holder ${p.lease.holder} · epoch ${p.lease.epoch} · expires ${dur(p.lease.expires_in_ms)} <button onclick="releasePart('${esc(p.id)}')">Force release</button>`).join("<br>")||"p0 unavailable";
 }catch(e){health.innerHTML='<span class="bad">disconnected</span>';}
 finally{refreshing=false;}}
function parentPath(p){const parts=String(p||"/").replace(/\/+$/,"").split("/").filter(Boolean);parts.pop();return"/"+parts.join("/");}
async function browse(to){
 if(to!=null) path.value=to;
 const p=path.value||"/";
 const r=await call({cmd:"read_dir",path:p});
 if(r.resp==="error"){files.textContent=r.message;return}
 const rows=[];
 if(p!=="/") rows.push(`<tr><td><button onclick='browse(${JSON.stringify(parentPath(p))})'>..</button></td><td>dir</td><td></td><td></td></tr>`);
 for(const e of r.entries||[]){
  const open=e.kind==="dir"
   ? `browse(${JSON.stringify(e.path)})`
   : `inspectPath(${JSON.stringify(e.path)})`;
  rows.push(`<tr><td><button onclick='${open}'>${esc(e.name)}</button></td><td>${esc(e.kind)}</td><td>${e.ino}</td><td><button onclick='inspectPath(${JSON.stringify(e.path)})'>stat</button></td></tr>`);
 }
 files.innerHTML="<table><tr><th>name</th><th>kind</th><th>ino</th><th></th></tr>"+rows.join("")+"</table>";
}
async function inspectPath(p){
 const r=await call({cmd:"inspect",path:p});
 if(r.resp==="error"){files.textContent=r.message;return}
 const e=r.entry||{};
 const dl=e.kind==="file"
  ? `<a href="/api/download?path=${encodeURIComponent(e.path||p)}" download><button type="button">Download</button></a> `
  : "";
 files.innerHTML="<pre>"+esc(JSON.stringify(r,null,2))+"</pre><p>"+dl+"<button onclick='browse()'>Back to listing</button></p>";
}
async function releasePart(part){ops.textContent=JSON.stringify(await call({cmd:"force_release",part}),null,2);}
async function loadSnaps(){let r=await call({cmd:"list_snapshots",path:null});snapshots.innerHTML=(r.snapshots||[]).map(s=>`${esc(s.path)}@${esc(s.name)} <button onclick="snapDelete('${esc(s.path+"@"+s.name)}')">Delete</button>`).join("<br>")||'<span class="muted">none</span>';}
async function snapCreate(){ops.textContent=JSON.stringify(await call({cmd:"snapshot_create",selector:snap.value}),null,2);loadSnaps();}
async function snapDelete(selector){ops.textContent=JSON.stringify(await call({cmd:"snapshot_delete",selector}),null,2);loadSnaps();}
async function doctor(){ops.textContent=JSON.stringify(await call({cmd:"doctor"}),null,2);}
async function logs(){let r=await call({cmd:"log_tail",lines:100});ops.textContent=(r.lines||[]).join("\n");}
refresh();loadSnaps();setInterval(refresh,2000);
</script></body></html>
