<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constellation</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0b1020;color:#dbe4ff}*{box-sizing:border-box}
body{margin:0}header{padding:18px 24px;border-bottom:1px solid #26304d;display:flex;justify-content:space-between}
main{max-width:1400px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
section{background:#111831;border:1px solid #26304d;border-radius:10px;padding:16px;min-height:120px}
h1{margin:0;font-size:20px}h2{margin:0 0 12px;color:#8eb7ff;font-size:16px}pre{white-space:pre-wrap;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #26304d}
table.compact{margin-top:0;font-variant-numeric:tabular-nums}table.compact th,table.compact td{padding:4px 8px;font-size:13px}
table.compact th{color:#8e9abb;font-weight:500;border-bottom-color:#3c4c78}
table.compact td.num,table.compact th.num{text-align:right}
table.compact td.st{width:1.4em;text-align:center;padding-right:2px}
button,input{background:#182344;color:inherit;border:1px solid #3c4c78;border-radius:5px;padding:7px;margin:2px}
button{cursor:pointer}.ok{color:#72e6a3}.bad{color:#ff8f9c}.wide{grid-column:1/-1}.span2{grid-column:span 2}.muted{color:#8e9abb}
.clickable{cursor:pointer}section.clickable h2::after{content:" →";color:#8eb7ff;font-weight:400}
a{color:#8eb7ff;text-decoration:none}a:hover{text-decoration:underline}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.dot.on{background:#72e6a3;box-shadow:0 0 0 2px rgba(114,230,163,.2)}
.dot.off{background:#5a657f}
</style>
</head>
<body><header><h1>Constellation control plane</h1><span id="health">connecting…</span></header>
<main>
<section><h2>Dashboard</h2><div id="dashboard"></div></section>
<section class="span2 clickable" onclick="if(!event.target.closest('a'))location.href='/peers.html'" title="Open peer details"><h2>Peers</h2><div id="peers"></div></section>
<section><h2>Leases / partitions</h2><div id="leases"></div></section>
<section class="wide"><h2>Files</h2><input id="path" value="/" aria-label="path"><button onclick="browse()">Browse</button><div id="files"></div></section>
<section><h2>Snapshots</h2><input id="snap" placeholder="/path@name"><button onclick="snapCreate()">Create</button><div id="snapshots"></div></section>
<section><h2>Ops</h2><button onclick="doctor()">Doctor</button><button onclick="logs()">Refresh logs</button><pre id="ops"></pre></section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const call=async req=>(await fetch("/api",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(req)})).json();
/** Strip only fractional trailing zeros ("10.50"→"10.5", "10.0"→"10").
 *  Must NOT use /\.?0+$/ — that also eats integer zeros ("1000"→"1"). */
function trimFrac(s){
 return s.includes(".")?s.replace(/0+$/,"").replace(/\.$/,""):s;
}
/** Auto-scale a byte count: B → KiB → MiB → GiB → TiB. */
function bytes(n){
 n=Number(n); if(!Number.isFinite(n)||n<0)n=0;
 const u=["B","KiB","MiB","GiB","TiB"];
 let v=n,i=0;
 while(v>=1024 && i<u.length-1){v/=1024;i++}
 if(i===0)return Math.round(v)+" B";
 const d=v>=100?0:v>=10?1:2;
 return trimFrac(v.toFixed(d))+" "+u[i];
}
/** Auto-scale a bit-rate already expressed in Mbps. */
function bw(mbps){
 if(mbps==null||mbps==="")return"—";
 const n=Number(mbps); if(!Number.isFinite(n))return"—";
 if(Math.abs(n)>=1000){
  const g=n/1000,d=Math.abs(g)>=100?0:Math.abs(g)>=10?1:2;
  return trimFrac(g.toFixed(d))+" Gbps";
 }
 if(Math.abs(n)>=1)return (Number.isInteger(n)?n:trimFrac(n.toFixed(1)))+" Mbps";
 if(Math.abs(n)>=0.001)return (n*1000).toFixed(0)+" kbps";
 return "0 Mbps";
}
/** Format a millisecond duration with a unit that matches its scale. */
function dur(ms,{ago=false}={}){
 if(ms==null||ms==="")return"—";
 const n=Number(ms); if(!Number.isFinite(n))return"—";
 const a=Math.abs(n); let s;
 if(a<1)s=(a*1000).toFixed(0)+" µs";
 else if(a<1000)s=(Number.isInteger(a)?a:a.toFixed(0))+" ms";
 else if(a<60e3)s=(a/1e3).toFixed(a<10e3?2:1)+" s";
 else if(a<3600e3)s=(a/60e3).toFixed(a<600e3?1:0)+" min";
 else if(a<86400e3)s=(a/3600e3).toFixed(1)+" h";
 else s=(a/86400e3).toFixed(1)+" d";
 return ago?s+" ago":s;
}
const pct=x=>((x||0)*100).toFixed(1);
function peerLat(p){
 const c=p.coop;
 if(c&&c.ttfb_ms_ewma!=null)return dur(c.ttfb_ms_ewma);
 if(c&&c.transport_rtt_ms!=null)return dur(c.transport_rtt_ms);
 return dur(p.rtt_ms);
}
function peerBw(p){
 // Prefer aggregate path rate (matches bench throughput under concurrency);
 // fall back to per-stream goodput when no aggregate sample exists yet.
 if(p.coop&&p.coop.aggregate_mbps_ewma!=null)return bw(p.coop.aggregate_mbps_ewma);
 return p.coop&&p.coop.goodput_mbps_ewma!=null?bw(p.coop.goodput_mbps_ewma):"—";
}
function peerPath(p){
 if(p.s3)return"—";
 const v=(p.path||p.coop?.path||"").toLowerCase();
 if(v==="direct")return"direct";
 if(v==="relay")return"relay";
 return"—";
}
function peerRow(p){
 const isS3=!!p.s3;
 const host=isS3?"S3":(p.hostname||("node "+p.node_id));
 const st=p.connected
  ?'<span class="dot on" title="connected"></span>'
  :'<span class="dot off" title="disconnected"></span>';
 const c=p.coop||{};
 const name=isS3
  ?`<a href="/peers.html#node-0">${esc(host)}</a>`
  :`<a href="/peers.html#node-${p.node_id}">${esc(host)}</a>`;
 return `<tr>
  <td class="st">${st}</td>
  <td>${name}</td>
  <td>${esc(peerPath(p))}</td>
  <td class="num">${esc(isS3?"—":(p.version||"—"))}</td>
  <td class="num">${isS3?"—":dur(p.last_seen_ms,{ago:true})}</td>
  <td class="num">${peerLat(p)}</td>
  <td class="num">${peerBw(p)}</td>
  <td class="num">${pct(c.hit_rate)}</td>
  <td class="num">${pct(c.miss_rate)}</td>
  <td class="num">${pct(c.err_rate)}</td>
 </tr>`;
}
let refreshing=false;
async function refresh(){
 if(refreshing)return; refreshing=true;
 try{let r=await(await fetch("/api/status")).json(),s=r.Status||r.status||r; if(r.resp==="status")s=r;
 document.querySelector("#health").innerHTML='<span class="ok">healthy</span> · '+esc(s.fs_uuid);
 const pf=s.prefetch||{};
 dashboard.innerHTML=`node <b>${s.node_id}</b> · ${esc(s.version||"—")} · uptime ${dur((s.uptime_s||0)*1000)}<br>${esc(s.backend)}<br>head ${s.spool.head_seq} · backlog ${s.spool.journal_backlog}<br>speculation ${(s.speculation||{}).outstanding||0} · replay queue ${(s.speculation||{}).pending_replay||0} · replayed ${(s.speculation||{}).stranded_replayed||0} · replay conflicts ${(s.speculation||{}).replay_conflicts||0}<br>local ${(s.speculation||{}).local||0} · deposed rollbacks ${(s.speculation||{}).local_rolled_back||0}${(s.speculation||{}).gate_pending?' · <span class="bad">takeover gate pending</span>':''}<br>${s.spool.last_ship_error?'<span class="bad">'+esc(s.spool.last_ship_error)+'</span>':'sync healthy'}<br>epoch ${s.epoch.active?esc(s.epoch.epoch_id):"inactive"} · designations ${s.designations.length}<br><br>${bytes(s.cache.used_bytes)} / ${bytes(s.cache.budget_bytes)} · ${s.cache.chunks} chunks<br>pinned ${bytes(s.cache.pinned_bytes||0)}<br>peer hits ${s.coop.peer_hits} · misses ${s.coop.peer_misses||0} (FP ${s.coop.peer_false_positives||0}) · errs ${s.coop.peer_errors||0} · S3 ${s.coop.s3_fetches} · hedges ${s.coop.hedges_fired}<br>prefetch ${pf.inflight||0}/${pf.gate_target||0} · queued ${pf.queued||0} · streams ${pf.streams||0}<br>window ${bytes(pf.window_bytes||0)} · stalls ${pf.stalls||0}<br>scan ${pf.scan_ahead_files||0} files · ${bytes(pf.scan_ahead_bytes||0)}`;
 const plist=s.p2p.peers||[];
 peers.innerHTML=`<table class="compact"><tr><th></th><th>host</th><th>path</th><th class="num">ver</th><th class="num">seen</th><th class="num">lat</th><th class="num">BW</th><th class="num">hit %</th><th class="num">miss %</th><th class="num">err %</th></tr>${plist.map(peerRow).join("")}</table>`;
 leases.innerHTML=(s.partitions||[]).map(p=>`${esc(p.id)} ${esc(p.root_path)} · holder ${p.lease.holder} · epoch ${p.lease.epoch} · expires ${dur(p.lease.expires_in_ms)} <button onclick="releasePart('${esc(p.id)}')">Force release</button>`).join("<br>")||"p0 unavailable";
 }catch(e){health.innerHTML='<span class="bad">disconnected</span>';}
 finally{refreshing=false;}}
function parentPath(p){const parts=String(p||"/").replace(/\/+$/,"").split("/").filter(Boolean);parts.pop();return"/"+parts.join("/");}
async function browse(to){
 if(to!=null) path.value=to;
 const p=path.value||"/";
 const r=await call({cmd:"read_dir",path:p});
 if(r.resp==="error"){files.textContent=r.message;return}
 const rows=[];
 if(p!=="/") rows.push(`<tr><td><button onclick='browse(${JSON.stringify(parentPath(p))})'>..</button></td><td>dir</td><td></td><td></td></tr>`);
 for(const e of r.entries||[]){
  const open=e.kind==="dir"
   ? `browse(${JSON.stringify(e.path)})`
   : `inspectPath(${JSON.stringify(e.path)})`;
  rows.push(`<tr><td><button onclick='${open}'>${esc(e.name)}</button></td><td>${esc(e.kind)}</td><td>${e.ino}</td><td><button onclick='inspectPath(${JSON.stringify(e.path)})'>stat</button></td></tr>`);
 }
 files.innerHTML="<table><tr><th>name</th><th>kind</th><th>ino</th><th></th></tr>"+rows.join("")+"</table>";
}
async function inspectPath(p){
 const r=await call({cmd:"inspect",path:p});
 if(r.resp==="error"){files.textContent=r.message;return}
 const e=r.entry||{};
 const dl=e.kind==="file"
  ? `<a href="/api/download?path=${encodeURIComponent(e.path||p)}" download><button type="button">Download</button></a> `
  : "";
 files.innerHTML="<pre>"+esc(JSON.stringify(r,null,2))+"</pre><p>"+dl+"<button onclick='browse()'>Back to listing</button></p>";
}
async function releasePart(part){ops.textContent=JSON.stringify(await call({cmd:"force_release",part}),null,2);}
async function loadSnaps(){let r=await call({cmd:"list_snapshots",path:null});snapshots.innerHTML=(r.snapshots||[]).map(s=>`${esc(s.path)}@${esc(s.name)} <button onclick="snapDelete('${esc(s.path+"@"+s.name)}')">Delete</button>`).join("<br>")||'<span class="muted">none</span>';}
async function snapCreate(){ops.textContent=JSON.stringify(await call({cmd:"snapshot_create",selector:snap.value}),null,2);loadSnaps();}
async function snapDelete(selector){ops.textContent=JSON.stringify(await call({cmd:"snapshot_delete",selector}),null,2);loadSnaps();}
async function doctor(){ops.textContent=JSON.stringify(await call({cmd:"doctor"}),null,2);}
async function logs(){let r=await call({cmd:"log_tail",lines:100});ops.textContent=(r.lines||[]).join("\n");}
refresh();loadSnaps();setInterval(refresh,2000);
</script></body></html>
