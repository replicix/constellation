[package]
name = "constellation-api"
description = "Control plane: unix-socket API, embedded web UI, metrics (DESIGN.md §10)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess", "dep:futures", "dep:bytes"]

[dependencies]
constellation-types.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tempfile.workspace = true
# In-process driving of the web router for the DNS-rebinding guard tests
# (`ServiceExt::oneshot`); already in the lockfile via axum.
tower = { version = "0.5", features = ["util"] }
