[package]
name = "constellation-csi"
description = "Kubernetes CSI driver: Identity/Controller/Node gRPC services over the CSI v1 protocol, driven by constellation-control's typed method table against engine pods"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "constellation_csi"
path = "src/lib.rs"

[[bin]]
name = "constellation-csi"
path = "src/main.rs"

[dependencies]
constellation-control.workspace = true
constellation-types.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
clap.workspace = true
async-trait = "0.1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
