[package]
name = "constellation-csi"
description = "Kubernetes CSI driver: Identity/Controller/Node gRPC services over the CSI v1 protocol, driven by constellation-control's typed method table against engine pods"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "constellation_csi"
path = "src/lib.rs"

[[bin]]
name = "constellation-csi"
path = "src/main.rs"

[dependencies]
constellation-control.workspace = true
constellation-types.workspace = true
# `fuse_mount_fd`, the node plugin's staging mount (plan 37 K3).
constellation-platform.workspace = true
libc.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
clap.workspace = true
async-trait = "0.1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
blake3.workspace = true
futures.workspace = true
serde_json.workspace = true
# The credentials a handoff relays, wiped once sent (`node::handoff`).
zeroize = "1.9.0"
# Engine-pod lifecycle (plan 37 §7) and the exec relay to them (`ws`).
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
# Installed as the process's rustls provider (kube builds its TLS config
# from the process default, which is ambiguous when a workspace-wide build
# unifies in another provider).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile.workspace = true
# Paused time for the rotation-retry backoff test.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
