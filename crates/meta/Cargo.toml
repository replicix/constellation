[package]
name = "constellation-meta"
description = "Metadata: local replica (SQLite engine trait), log records, journal (DESIGN.md §4, §5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
constellation-fs-core.workspace = true
constellation-mtree.workspace = true
fjall = { version = "3.1", package = "fjall" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `fjall_drop_deadlock` installs a `log` logger to widen fjall's shutdown
# race window (the version fjall itself already pulls in).
log = "0.4"
