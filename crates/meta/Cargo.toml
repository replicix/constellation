[package]
name = "constellation-meta"
description = "Metadata: local replica (SQLite engine trait), log records, journal (DESIGN.md §4, §5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
constellation-fs-core.workspace = true
constellation-mtree.workspace = true
constellation-types.workspace = true
fjall = { version = "3.1", package = "fjall" }
# Snapshot-schedule policies (plan 32 Step 1): `tz=` names are validated
# against jiff's bundled tzdb so the parse is pure and musl-static safe.
jiff.workspace = true
# Retention verdicts carry a handful of reasons each (plan 32 Step 2);
# the common case is one or two and never reaches the heap.
smallvec = "1.15"
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `fjall_drop_deadlock` installs a `log` logger to widen fjall's shutdown
# race window (the version fjall itself already pulls in).
log = "0.4"
# Property tests for the two xattr policy languages: the canonical form
# round-trips, and printing is idempotent (snapsched::policy).
proptest = "1"
