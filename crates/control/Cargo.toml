[package]
name = "constellation-control"
description = "The control protocol (plan 31 §9): framing, handshake, typed method table, authz, audit, transports, server runtime, client library and schema generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The localhost HTTP adapter and embedded operator UI (`web`). Off by
# default so the library (and its Windows cross-check) carries no HTTP stack.
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess"]

[dependencies]
constellation-types.workspace = true
constellation-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false }
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
blake3.workspace = true
toml.workspace = true
schemars = { version = "1", features = ["derive"] }
axum = { version = "0.8", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Peer credentials, SCM_RIGHTS and getgrnam only exist on unix; the Windows
# build gets the `NamedPipe` stub and no libc at all.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# In-process driving of the web adapter (`ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }
