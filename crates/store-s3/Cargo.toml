[package]
name = "constellation-store-s3"
description = "S3 chunk/log/lease store: conditional writes, compression codecs, GC (DESIGN.md §2, §3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
constellation-fs-core.workspace = true
constellation-mtree.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
object_store.workspace = true
# Official AWS SDK credential chain (env, shared config/credentials,
# AWS_PROFILE, SSO, IMDS, ECS/IRSA, process). Default features already
# enable SSO + credentials-process.
aws-config.workspace = true
aws-credential-types.workspace = true
aws-types.workspace = true
async-trait = "0.1"
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zstd.workspace = true
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
zeroize = "1.9.0"
region = "4.0.0"
tracing.workspace = true
memmap2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["test-util"] }
