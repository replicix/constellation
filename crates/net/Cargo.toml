[package]
name = "constellation-net"
description = "P2P fast path: iroh endpoint, registry allowlist, gossip, cooperative cache, source selection (DESIGN.md §7, §8)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
constellation-platform.workspace = true
blake3.workspace = true
futures-lite = "2.6.1"
# `unstable-custom-transports` is what exposes the `PathSelector` API
# (`iroh::endpoint::transports`) that `addrs::PreferredPaths` implements;
# nothing here uses a custom transport. Unstable: re-check on iroh bumps.
iroh = { workspace = true, features = ["unstable-custom-transports"] }
iroh-gossip.workspace = true
netwatch.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
