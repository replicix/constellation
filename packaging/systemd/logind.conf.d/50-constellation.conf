# Installed to /etc/systemd/logind.conf.d/50-constellation.conf.
#
# Constellation takes a logind delay inhibitor ("sleep:shutdown") so a node
# can hand back its sticky delegation grants before the host suspends or
# shuts down (plan 46 section 5.4). logind waits for the inhibitor to be
# released, but at most InhibitDelayMaxSec (default 5 s) after the
# PrepareForSleep / PrepareForShutdown signal.
#
# 30 s: a release drains the subtree's journal to the object store and then
# ends the grant, which is a few round trips and an upload; 5 s is shorter
# than one slow upload, while a delay beyond half a minute makes a suspend
# or shutdown feel hung and sits near the usual 90 s service stop timeout.
# The window is a ceiling, not a cost: the inhibitor is released as soon as
# the release finishes, so an idle node adds no delay. A drain that cannot
# finish in time releases what it has; the rest is a lost-holder case on
# resume, never a rollback.
[Login]
InhibitDelayMaxSec=30
