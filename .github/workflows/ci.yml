name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Plan 37 §13: the CSI driver's unit tests on their own (also part of
  # `test`'s `--workspace`), the one CSI job cheap enough for every PR.
  csi-unit:
    name: crates/csi unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p constellation-csi

  integration:
    name: Integration (containerized FUSE + floci S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build test-runner image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile
          tags: constellation-smoke:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run containerized suites (smoke, compliance, stress)
        run: tests/compose-test.sh
        env:
          SMOKE_IMAGE: constellation-smoke:ci

      - name: LocalStack-compatible emulator logs on failure
        if: failure()
        run: docker compose logs floci || true

  harness:
    name: Fault injection (toxiproxy + model oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE and suite tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 fio stress-ng

      - name: Build
        run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos

      - name: Run all fault-injection scenarios
        run: cargo run --release -q -p constellation-harness -- run

  # Plan 38 §6/Z2c: the transport matrix's `dev-fuse` leg on every push,
  # plus the smoke test on the shipped default (`auto`) and on `dev-fuse`.
  # A hosted runner's kernel does not grant FUSE-over-io_uring, so `auto`
  # here is the ladder's fallback (its `last_fallback` reason is asserted
  # by the smoke test); both ring legs run nightly on a 6.14+ runner
  # (nightly.yml, `transport-matrix`).
  transport-dev-fuse:
    name: FUSE transport matrix (dev-fuse leg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE and suite tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 fio
      - name: Build
        run: cargo build --release -p constellation -p constellation-harness
      - name: Smoke on the default transport (auto) and on dev-fuse
        run: |
          CONSTELLATION_HARNESS_BIN=target/release/harness bash tests/smoke.sh
          CONSTELLATION_HARNESS_BIN=target/release/harness CONSTELLATION_FUSE_TRANSPORT=dev-fuse \
            bash tests/smoke.sh
      - name: Transport matrix, dev-fuse leg
        run: make transport-matrix TRANSPORTS=dev-fuse
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: transport-dev-fuse, path: target/transport-matrix }

  cross-check:
    name: Darwin + Windows-library type-check from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-gnu
      # rust-toolchain.toml pins the channel; make sure the pinned toolchain
      # (not only `stable`) has the cross targets.
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
      - run: make check-cross
