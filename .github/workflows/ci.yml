name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Compiles the release binaries every other job in this workflow runs
  # (constellation, harness, chaos) exactly once; `integration`, `harness`
  # and `transport-dev-fuse` download the result instead of compiling their
  # own copy. actions/upload-artifact zips its payload (dropping the
  # executable bit), so the binaries are tarred first and restored with
  # `tar -xzf` on the other side (.github/actions/download-ci-bin).
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    # Same base image tests/docker/Dockerfile's `build` stage uses, not
    # ubuntu-latest's own (newer) glibc: `integration` runs this binary
    # inside a debian:bookworm-slim container, which an ubuntu-latest
    # build would link against a glibc too new for it (confirmed locally —
    # a bare-host build refused to start under bookworm-slim with
    # `GLIBC_2.39' not found). A bookworm-linked binary runs fine
    # everywhere else too (glibc is backward- but not forward-compatible),
    # including directly on the ubuntu-latest runners `harness` and
    # `transport-dev-fuse` use. No dtolnay/rust-toolchain: this image
    # bundles rustup, which fetches the pinned 1.98 (rust-toolchain.toml)
    # on first `cargo` invocation, same as the Dockerfile already does.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      - run: tar -czf release-bin.tar.gz -C target/release constellation harness chaos
      - uses: actions/upload-artifact@v4
        with:
          name: release-bin
          path: release-bin.tar.gz
          retention-days: 1

  # Builds every workspace test binary once (`cargo nextest archive`) and
  # uploads the archive; `unit-test`'s matrix only runs slices of it, no
  # recompile. Doctests are not in the archive (nextest does not run them —
  # `doctest` below covers them) and csi-unit below still runs
  # `constellation-csi`'s tests on their own (plan 37 §13: the one CSI job
  # cheap enough to want on every PR even though nextest's --workspace run
  # covers the same tests too).
  unit-test-archive:
    name: Unit tests (archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest archive --workspace --archive-file target/nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1

  unit-test:
    name: Unit tests (partition ${{ matrix.partition }}/${{ strategy.job-total }})
    needs: unit-test-archive
    strategy:
      fail-fast: false
      # N parallel slices of the one archive unit-test-archive built. 6, not
      # fewer: `count:i/N` splits by test count, not measured duration, and
      # a handful of constellation-authority::sim / constellation-model
      # property tests (randomized, many iterations) run 1-7 minutes each
      # and land unevenly across slices — confirmed locally (one partition
      # of 4 ran 22 such tests back to back for 430s on a 32-core box; a
      # 4-core hosted runner would be slower still). Bump both this list
      # and the /6 below together to retune N from observed per-partition
      # wall time (Actions UI), not from a hunch.
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      # No toolchain install, no rust-cache: running an already-built
      # archive needs `cargo` only to dispatch to the nextest binary below
      # (ubuntu-latest ships a default Rust toolchain), never rustc.
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: target
      - run: |
          cargo nextest run --no-fail-fast --archive-file target/nextest-archive.tar.zst \
            --partition count:${{ matrix.partition }}/6

  # nextest does not run doctests; kept in its own job since it is a real
  # compile (one doctest binary per documented item) sharing the `dev`
  # dependency cache with lint and unit-test-archive.
  doctest:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --doc --workspace

  # Plan 37 §13: the CSI driver's unit tests on their own (also part of
  # `unit-test`'s `--workspace` archive), the one CSI job cheap enough for
  # every PR.
  csi-unit:
    name: crates/csi unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p constellation-csi
      # The chart without a cluster (plan 37 K7): lint, integers rendered as
      # integers however a number arrives, the helm-test hook; then packaged.
      - uses: azure/setup-helm@v4
      - run: make csi-chart

  integration:
    name: Integration (containerized FUSE + floci S3)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/download-ci-bin
      # tests/docker/Dockerfile's `build` stage, with CI_PREBUILT set,
      # copies these instead of running `cargo build` itself (.dockerignore
      # excludes target/, so the binaries are placed in ci-bin/ instead).
      - run: |
          mkdir -p ci-bin
          cp target/release/constellation target/release/harness ci-bin/
      - uses: docker/setup-buildx-action@v3

      - name: Build test-runner image (cached, from the shared build's binaries)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile
          tags: constellation-smoke:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: CI_PREBUILT=1

      - name: Run containerized suites (smoke, compliance, stress)
        run: tests/compose-test.sh
        env:
          SMOKE_IMAGE: constellation-smoke:ci

      - name: LocalStack-compatible emulator logs on failure
        if: failure()
        run: docker compose logs floci || true

  harness:
    name: Fault injection (toxiproxy + model oracle, shard ${{ matrix.shard }}/5)
    needs: build
    # 5-way shard of the scenario list (`harness run --shard i/5`, round-robin
    # by selection order): unsharded, this lane's ~200 scenarios summed to
    # ~105 min on a hosted runner (the pipeline's critical path). Round-robin
    # spreads out the handful of scenario clusters that run long
    # back-to-back (snapsched's four, git-under-flock's six, …) across
    # different shards rather than piling them into one; replaying that
    # run's per-scenario timings through `idx % 5` puts the heaviest shard
    # at ~23 min, comfortable headroom under the ~30 min target for runner
    # variance. Bump both this list and the /5 below together to retune
    # from observed Actions wall time, not from a hunch.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE and suite tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 fio stress-ng

      # `csi-credential-revocation` needs its own native, signature-checking
      # versitygw (and toxiproxy-server) regardless of --s3-backend: floci
      # accepts any key pair, so only a real SigV4 check can show a revoked
      # key refused. Cached by the versions tests/ci/install-native-s3.sh
      # pins; `find_bin` (crates/harness/src/s3env.rs) looks in ~/.local/bin
      # on its own, so nothing further needs PATH.
      - name: Cache native S3 test servers (versitygw, toxiproxy-server)
        id: native-s3-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: native-s3-${{ runner.os }}-${{ hashFiles('tests/ci/install-native-s3.sh') }}

      - name: Install native S3 test servers
        if: steps.native-s3-cache.outputs.cache-hit != 'true'
        run: tests/ci/install-native-s3.sh

      - uses: ./.github/actions/download-ci-bin

      # snapsched-write-overhead is a write-throughput measurement with a
      # lease-stability assertion that this 4-vCPU runner can trip under its
      # own host load (fio + a 100k-file tree write + the snapshot scheduler
      # starve the lease holder's heartbeat past the backup's 1.5 s silence
      # bound, a legitimate takeover under real contention, not a bug); it
      # runs in the nightly lane instead (docs/plans/v1/PROGRESS.md).
      - name: Run this shard's fault-injection scenarios
        run: |
          target/release/harness run --exclude snapsched-write-overhead \
            --shard ${{ matrix.shard }}/5

  # Plan 38 §6/Z2c: the transport matrix's `dev-fuse` leg on every push,
  # plus the smoke test on the shipped default (`auto`) and on `dev-fuse`.
  # A hosted runner's kernel does not grant FUSE-over-io_uring, so `auto`
  # here is the ladder's fallback (its `last_fallback` reason is asserted
  # by the smoke test); both ring legs run nightly on a 6.14+ runner
  # (nightly.yml, `transport-matrix`).
  transport-dev-fuse:
    name: FUSE transport matrix (dev-fuse leg)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE and suite tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 fio
      - uses: ./.github/actions/download-ci-bin
      - name: Smoke on the default transport (auto) and on dev-fuse
        run: |
          CONSTELLATION_BIN=target/release/constellation CONSTELLATION_HARNESS_BIN=target/release/harness \
            bash tests/smoke.sh
          CONSTELLATION_BIN=target/release/constellation CONSTELLATION_HARNESS_BIN=target/release/harness \
            CONSTELLATION_FUSE_TRANSPORT=dev-fuse bash tests/smoke.sh
      # Calls the script directly rather than `make transport-matrix`: that
      # target depends on $(RELEASE_BIN)/$(RELEASE_HARNESS), which the
      # Makefile always rebuilds (a phony FORCE prerequisite) — exactly
      # what this job no longer has a toolchain to do.
      - name: Transport matrix, dev-fuse leg
        run: TRANSPORTS=dev-fuse tests/transport-matrix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: transport-dev-fuse, path: target/transport-matrix }

  cross-check:
    name: Darwin + Windows-library type-check from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-gnu
      # rust-toolchain.toml pins the channel; make sure the pinned toolchain
      # (not only `stable`) has the cross targets.
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make check-cross
