name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration:
    name: Integration (containerized FUSE + floci S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build test-runner image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile
          tags: constellation-smoke:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run containerized suites (smoke, compliance, stress)
        run: tests/compose-test.sh
        env:
          SMOKE_IMAGE: constellation-smoke:ci

      - name: LocalStack-compatible emulator logs on failure
        if: failure()
        run: docker compose logs floci || true

  harness:
    name: Fault injection (toxiproxy + model oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

      - name: Build
        run: cargo build --release -p constellation -p constellation-harness

      - name: Run all fault-injection scenarios
        run: cargo run --release -q -p constellation-harness -- run
