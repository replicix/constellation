name: Nightly full matrix

on:
  # schedule:
  #   - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check 2>&1 | tee lint.log
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-logs, path: lint.log }

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace 2>&1 | tee unit.log
      - run: cargo install cargo-audit --locked && cargo audit 2>&1 | tee audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-audit-logs, path: "*.log" }

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build smoke
      - run: docker compose --profile test run --rm smoke 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-logs, path: integration.log }

  compliance:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build compliance
      - run: docker compose --profile test run --rm compliance 2>&1 | tee compliance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compliance-logs, path: compliance.log }

  harness:
    needs: compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 fio stress-ng
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      # `pipefail`: the run's exit status must survive `tee`.
      - run: |
          set -o pipefail
          target/release/harness run --results-json results-linux-fuse.json 2>&1 | tee harness-linux-fuse.log
      # The `parity` job downloads every `harness-*` artifact and compares the
      # lanes' results-<lane>.json files.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: harness-linux-fuse, path: "*-linux-fuse.*" }

  harness-lanes-linux:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        lane: [linux-fuse-process]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 fio stress-ng
      - run: bash tests/ci/install-native-s3.sh
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      - run: |
          set -o pipefail
          target/release/harness run --s3-backend process --frontend fuse \
            --results-json results-${{ matrix.lane }}.json 2>&1 | tee harness-${{ matrix.lane }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "harness-${{ matrix.lane }}", path: "*-${{ matrix.lane }}.*" }

  conformance:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p constellation-vfs --features conformance 2>&1 | tee conformance.log
      - run: |
          set -o pipefail
          cargo test -p constellation-engine --test conformance -- --nocapture 2>&1 | tee -a conformance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: conformance-logs, path: conformance.log }

  parity:
    if: always()
    needs: [harness, harness-lanes-linux, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker's own tests: a deliberate mismatch must fail closed.
      - run: python3 -m unittest discover -s tests -p 'test_parity.py'
      - uses: actions/download-artifact@v4
        with: { path: results, pattern: "harness-*", merge-multiple: true }
      # Every lane this workflow runs is required: a lane whose job died
      # before writing its results must fail parity, not drop out of it.
      - run: |
          set -o pipefail
          python3 tests/parity.py --expect tests/platform-parity.toml \
            --require-lane linux-fuse --require-lane linux-fuse-process \
            results/results-*.json | tee -a "$GITHUB_STEP_SUMMARY"

  xfstests:
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build xfstests
      - run: docker compose --profile test run --rm xfstests 2>&1 | tee xfstests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: xfstests-logs, path: xfstests.log }

  performance:
    needs: xfstests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 fio jq
      - run: cargo build --release -p constellation -p constellation-harness
      - run: make perf-gate 2>&1 | tee performance.log
      # Plan 38 §6's read-path cost gate. Recording, not gating: the
      # committed baseline is host-specific (an idle 32-CPU host) and a
      # shared runner's CPU per GiB is neither comparable to it nor stable
      # enough to gate on, so the lane runs against a baseline of its own
      # that does not exist yet — the script then creates it from this run
      # and passes. What it catches nightly is the lane rotting (a mount
      # that no longer comes up, a status field renamed, fio arguments that
      # stopped parsing) and the numbers themselves, in the artifact. Z1
      # establishes a runner baseline and turns the comparison on.
      - run: |
          READ_CPU_BASELINE=read-cpu-ci-baseline.json \
          READ_CPU_OUT=read-cpu.jsonl \
          READ_CPU_REPEATS=1 READ_CPU_SEQ_MIB=256 READ_CPU_RAND_MIB=128 \
          READ_CPU_SMALL_FILES=1024 READ_CPU_RAND_SECONDS=10 \
            make read-cpu-gate 2>&1 | tee read-cpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-logs
          path: |
            performance.log
            read-cpu.log
            read-cpu.jsonl
            read-cpu-ci-baseline.json

  # Plan 38 §6/Z2: the FUSE transport matrix, the ring leg (`auto`) and the
  # `dev-fuse` control, on a runner whose kernel grants FUSE-over-io_uring.
  # Hosted runners cannot (no 6.14+ kernel with `fuse.enable_uring=Y`), so
  # this job runs on a self-managed runner registered with the `fuse-uring`
  # label: kernel 6.14+, `fuse.enable_uring=Y` (module option or
  # `/sys/module/fuse/parameters/enable_uring`), docker, fuse3, fio,
  # python3 (the cost gate), util-linux's `taskset`
  # (`transport-lock-wait-budget`) and passwordless sudo — see docs/how-to-guides/development/TESTING.md,
  # "The ring legs in CI". A runner that carries the label but does not
  # grant the ring fails the first step instead of passing on the fallback.
  # Off until such a runner is registered: set the repository variable
  # FUSE_URING_RUNNER to `true` to turn it on. Without it the job is
  # skipped at once (rather than queued for a runner that does not exist,
  # which GitHub fails after 24 h), and `summary` reports it `skipped`.
  transport-matrix:
    needs: unit
    if: vars.FUSE_URING_RUNNER == 'true'
    runs-on: [self-hosted, linux, fuse-uring]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The runner grants the ring
        run: |
          uname -r
          test "$(cat /sys/module/fuse/parameters/enable_uring)" = Y
          test "$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)" = 0
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      # Every scenario once per leg: dev-fuse and the shipped `auto` (every
      # plain mount on the ring, cluster-lock ones included). Each leg
      # prints its census of which mounts got which transport. The cost gate
      # runs per leg against its own baseline,
      # read-cpu-uring-runner-baseline-<leg>.json, which a fresh checkout
      # does not have: each leg blesses (records) its own numbers.
      - run: |
          set -o pipefail
          TRANSPORTS="dev-fuse auto" SCENARIOS=all READ_CPU_GATE=1 \
            READ_CPU_BASELINE=read-cpu-uring-runner-baseline.json \
            tests/transport-matrix.sh 2>&1 | tee transport-matrix.log
      # pjdfstest per transport: /dev/fuse and the ring.
      - run: |
          set -o pipefail
          docker compose --profile test build compliance
          docker compose --profile test run --rm -e CONSTELLATION_FUSE_TRANSPORT=dev-fuse \
            compliance 2>&1 | tee compliance-dev-fuse.log
          CONSTELLATION_FUSE_ZERO_COPY_MIN_READ=0 make compliance-ring 2>&1 | tee compliance-ring.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-matrix
          path: |
            transport-matrix.log
            compliance-*.log
            target/transport-matrix
            read-cpu-uring-runner-baseline-*.json

  # Plan 38 §6/Z4b: the 7.3 lane ("run in the Rawhide guest"). FUSE-over-io_uring
  # zero-copy needs a kernel whose FUSE_INIT offers io_uring buffer pools
  # (7.3+) and CAP_SYS_ADMIN in the initial user namespace, so this runs as
  # root on a self-hosted runner booted into such a kernel (label
  # `fuse-uring-zc`). Elsewhere the four zero-copy scenarios SKIP loudly
  # (their `requires`), which the transport-matrix job above shows. Without
  # such a runner registered the job would queue forever: it runs only when
  # the repository variable FUSE_URING_ZC_RUNNER is "true".
  zero-copy-7-3:
    needs: unit
    if: vars.FUSE_URING_ZC_RUNNER == 'true'
    runs-on: [self-hosted, linux, fuse-uring-zc]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The runner grants zero-copy (7.3+, the ring, root)
        run: |
          uname -r
          test "$(cat /sys/module/fuse/parameters/enable_uring)" = Y
          test "$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)" = 0
          sudo -n true
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      # The four zero-copy scenarios, then the whole matrix with zero-copy
      # queues asked for (they are opt-in, plan 38 Z4b; the transport policy
      # stays the default, which puts cluster-lock mounts on the ring), both
      # as root (a root HOME of its own: the daemon must not write
      # root-owned files into the runner user's ~/.config).
      - run: |
          set -o pipefail
          sudo env HOME=/root PATH="$PATH" CONSTELLATION_HARNESS_DOCKER_PREFIX=zc \
            target/release/harness run zero-copy-single-chunk \
            zero-copy-chunk-spanning-fallback zero-copy-eviction-while-inflight \
            zero-copy-disabled-by-verify-always 2>&1 | tee zero-copy-scenarios.log
          sudo env HOME=/root PATH="$PATH" CONSTELLATION_HARNESS_DOCKER_PREFIX=zc \
            CONSTELLATION_FUSE_URING_ZERO_COPY=auto \
            target/release/harness run 2>&1 | tee zero-copy-matrix.log
      # The cost gate on all three transports, as root (the uring_zc leg
      # needs CAP_SYS_ADMIN; the other two run the same way to compare):
      # each leg records its own baseline on a fresh checkout.
      - run: |
          set -o pipefail
          for leg in dev-fuse:auto auto:off auto:auto; do
            sudo env HOME=/root PATH="$PATH" CONSTELLATION_FUSE_TRANSPORT="${leg%%:*}" \
              CONSTELLATION_FUSE_URING_ZERO_COPY="${leg##*:}" \
              READ_CPU_BASELINE="read-cpu-zc-runner-baseline-${leg/:/-}.json" \
              tests/read-cpu-gate.sh 2>&1 | tee -a read-cpu-zc.log
          done
          # The zero-copy threshold's measurement (never gated): the
          # read-size lanes on `uring` and on `uring_zc` with every read
          # zero-copy.
          lanes="cold-seq-1m $(tests/read-cpu-gate.sh --size-lanes)"
          for leg in off:512k auto:0; do
            sudo env HOME=/root PATH="$PATH" CONSTELLATION_FUSE_TRANSPORT=auto \
              CONSTELLATION_FUSE_URING_ZERO_COPY="${leg%%:*}" \
              CONSTELLATION_FUSE_ZERO_COPY_MIN_READ="${leg##*:}" \
              READ_CPU_LANES="$lanes" \
              READ_CPU_BASELINE="read-cpu-zc-runner-sizes-${leg%%:*}.json" \
              tests/read-cpu-gate.sh 2>&1 | tee -a read-cpu-zc-sizes.log
          done
      # pjdfstest with the daemon as root on the ring: the suite container
      # has CAP_SYS_ADMIN, so `compliance-ring` negotiates uring_zc here
      # (its first line says which transport it got).
      - run: |
          set -o pipefail
          make compliance-ring 2>&1 | tee compliance-ring-zc.log
          grep -q "FUSE transport: uring_zc" compliance-ring-zc.log
      # The steps above ran as root inside the checkout (the gate writes
      # its per-leg baselines here, the harness its results): hand
      # everything back to the runner user, so a persistent runner's next
      # checkout can clean the workspace, and show what root had left.
      - name: No root-owned files left in the workspace
        if: always()
        run: |
          sudo find "$GITHUB_WORKSPACE" -xdev -user root -print | head -50
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-copy-7-3
          path: |
            zero-copy-*.log
            read-cpu-zc.log
            read-cpu-zc-sizes.log
            compliance-ring-zc.log
            read-cpu-zc-runner-baseline-*.json
            read-cpu-zc-runner-sizes-*.json

  linux-package:
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make dist-linux 2>&1 | tee package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package
          path: |
            package.log
            target/dist/*

  # Plan 37 §13. csi-sanity's Identity, Controller and Node groups against
  # constellation-csi on its in-memory backends: no S3, no cluster, no
  # mount(2), so a hosted runner does (K0's consequence keeps it there).
  csi-sanity:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
      - run: |
          set -o pipefail
          CSI_SANITY_BIN="$(go env GOPATH)/bin/csi-sanity" make csi-sanity 2>&1 | tee csi-sanity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: csi-sanity-logs, path: csi-sanity.log }

  # Plan 37 §13 / K3: the driver on a real kind cluster — csi-sanity's Node
  # group against the deployed node plugin (real FUSE staging mounts, real
  # engine pods), then every `harness k8s-scenario`. Plan 37 "K0 results"
  # (question 5) could not verify FUSE in a hosted runner's kind nodes, so
  # this runs on a self-hosted, FUSE-capable runner (labels below; docker,
  # /dev/fuse, kind, kubectl and helm installed) until a hosted one is
  # verified. Without such a runner registered the job would queue forever:
  # it runs only when the repository variable CONSTELLATION_FUSE_RUNNER is
  # "true". Each step brings up and deletes its own cluster (one at a time).
  kind-e2e:
    needs: csi-sanity
    if: vars.CONSTELLATION_FUSE_RUNNER == 'true'
    runs-on: [self-hosted, linux, x64, fuse]
    timeout-minutes: 120
    env:
      CSI_IMAGE: constellation-csi:nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
      - run: cargo build --release -p constellation-harness
      - run: make csi-image CSI_IMAGE="$CSI_IMAGE"
      - run: |
          set -o pipefail
          CSI_SKIP_BUILD=1 KIND_CLUSTER=nightly-sanity-kind \
          CSI_SANITY_BIN="$(go env GOPATH)/bin/csi-sanity" \
            bash tests/csi/sanity-kind.sh 2>&1 | tee kind-e2e.log
      - run: |
          set -o pipefail
          KIND_CLUSTER=nightly-k8s-harness target/release/harness k8s-scenario --all \
            --image "$CSI_IMAGE" --results-json results-linux-k8s-kind.json 2>&1 | tee -a kind-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kind-e2e
          path: |
            kind-e2e.log
            results-linux-k8s-kind.json
      # The harness and sanity-kind.sh tear down what they created, also on
      # SIGINT/SIGTERM, but a cancellation's follow-up SIGKILL or a runner
      # crash skips that. The names are fixed and the runner persistent, so
      # a leftover cluster would make every later night refuse to start.
      - name: Remove leftover clusters
        if: always()
        run: |
          kind delete cluster --name nightly-sanity-kind || true
          kind delete cluster --name nightly-k8s-harness || true
          docker ps -aq --filter name='^nightly-k8s-harness-k8s-floci' | xargs -r docker rm -f || true

  # Plan 37 §13 / K5: the release gate for §8's headline guarantee — an
  # engine-pod image upgrade under an actively writing, creating and
  # reading pod is a pause, never an error. 20 consecutive handoffs (§15's
  # K5 gate), each with a snapshot asked for as the handoff starts; the
  # harness fails the job on any error in any round, on bytes that do not
  # read back on the other worker, on a snapshot missing what was
  # acknowledged before it, and on a writer's pause (`pause_ms`) p99 of 2 s
  # or more. csi-snapshot-clone-mount runs in kind-e2e's --all. Same self-hosted
  # FUSE runner and condition as kind-e2e, after it (one kind cluster at a
  # time on the runner).
  upgrade-under-load:
    needs: kind-e2e
    if: vars.CONSTELLATION_FUSE_RUNNER == 'true'
    runs-on: [self-hosted, linux, x64, fuse]
    timeout-minutes: 240
    env:
      CSI_IMAGE: constellation-csi:nightly-handoff
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p constellation-harness
      - run: make csi-image CSI_IMAGE="$CSI_IMAGE"
      - run: |
          set -o pipefail
          KIND_CLUSTER=nightly-upgrade-under-load target/release/harness k8s-scenario \
            csi-engine-pod-handoff-under-load --repeat 20 --image "$CSI_IMAGE" \
            --results-json results-upgrade-under-load.json 2>&1 | tee upgrade-under-load.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-under-load
          path: |
            upgrade-under-load.log
            results-upgrade-under-load.json
      - name: Remove leftover clusters
        if: always()
        run: |
          kind delete cluster --name nightly-upgrade-under-load || true
          docker ps -aq --filter name='^nightly-upgrade-under-load-k8s-floci' | xargs -r docker rm -f || true

  macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace 2>&1 | tee macos.log
      - run: make dist-macos 2>&1 | tee -a macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: |
            macos.log
            target/dist/*

  summary:
    if: always()
    needs: [lint, unit, integration, compliance, harness, harness-lanes-linux, conformance, parity, xfstests, performance, transport-matrix, zero-copy-7-3, linux-package, csi-sanity, kind-e2e, upgrade-under-load, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo '| Job | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" > nightly-results.json
      - uses: actions/upload-artifact@v4
        with: { name: nightly-summary, path: nightly-results.json }
