name: Nightly full matrix

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check 2>&1 | tee lint.log
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-logs, path: lint.log }

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace 2>&1 | tee unit.log
      - run: cargo install cargo-audit --locked && cargo audit 2>&1 | tee audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-audit-logs, path: "*.log" }

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build smoke
      - run: docker compose --profile test run --rm smoke 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-logs, path: integration.log }

  compliance:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build compliance
      - run: docker compose --profile test run --rm compliance 2>&1 | tee compliance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compliance-logs, path: compliance.log }

  harness:
    needs: compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 fio stress-ng
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      # `pipefail`: the run's exit status must survive `tee`.
      - run: |
          set -o pipefail
          target/release/harness run --results-json results-linux-fuse.json 2>&1 | tee harness-linux-fuse.log
      # The `parity` job downloads every `harness-*` artifact and compares the
      # lanes' results-<lane>.json files.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: harness-linux-fuse, path: "*-linux-fuse.*" }

  harness-lanes-linux:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        lane: [linux-fuse-process]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 fio stress-ng
      - run: bash tests/ci/install-native-s3.sh
      - run: cargo build --release -p constellation -p constellation-harness -p constellation-chaos
      - run: |
          set -o pipefail
          target/release/harness run --s3-backend process --frontend fuse \
            --results-json results-${{ matrix.lane }}.json 2>&1 | tee harness-${{ matrix.lane }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "harness-${{ matrix.lane }}", path: "*-${{ matrix.lane }}.*" }

  conformance:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p constellation-vfs --features conformance 2>&1 | tee conformance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: conformance-logs, path: conformance.log }

  parity:
    if: always()
    needs: [harness, harness-lanes-linux, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker's own tests: a deliberate mismatch must fail closed.
      - run: python3 -m unittest discover -s tests -p 'test_parity.py'
      - uses: actions/download-artifact@v4
        with: { path: results, pattern: "harness-*", merge-multiple: true }
      # Every lane this workflow runs is required: a lane whose job died
      # before writing its results must fail parity, not drop out of it.
      - run: |
          set -o pipefail
          python3 tests/parity.py --expect tests/platform-parity.toml \
            --require-lane linux-fuse --require-lane linux-fuse-process \
            results/results-*.json | tee -a "$GITHUB_STEP_SUMMARY"

  xfstests:
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile test build xfstests
      - run: docker compose --profile test run --rm xfstests 2>&1 | tee xfstests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: xfstests-logs, path: xfstests.log }

  performance:
    needs: xfstests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --release -p constellation -p constellation-harness
      - run: make perf-gate 2>&1 | tee performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: performance-logs, path: performance.log }

  linux-package:
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make dist-linux 2>&1 | tee package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package
          path: |
            package.log
            target/dist/*

  macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace 2>&1 | tee macos.log
      - run: make dist-macos 2>&1 | tee -a macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: |
            macos.log
            target/dist/*

  summary:
    if: always()
    needs: [lint, unit, integration, compliance, harness, harness-lanes-linux, conformance, parity, xfstests, performance, linux-package, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo '| Job | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" > nightly-results.json
      - uses: actions/upload-artifact@v4
        with: { name: nightly-summary, path: nightly-results.json }
