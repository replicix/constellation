name: Performance Regression

# The corpus-replay benchmark (tests/perf_regression/) on a hosted runner.
# Pull requests are compared with the latest run on main: the results of
# every push to main are kept in the `perf-results` artifact, so a pull
# request runs the suite once (no base build). The report goes to the job
# summary and to one comment on the pull request, updated in place.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions per profile (median reported)"
        required: false
        default: "1"
      seed:
        description: "Corpus replay seed"
        required: false
        default: "42"
      corpus_limit:
        description: "Max corpus files (default 20k for hosted-runner limits; use 120367 for full)"
        required: false
        default: "20000"
      max_file_bytes:
        description: "Cap each staged file size (bytes). Default 2MiB keeps tree shape on runner disk."
        required: false
        default: "2097152"
      cache_rust_build:
        description: "Only build constellation and save the Rust cache (skip the suite)"
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_RUST_BUILD: ${{ github.event.inputs.cache_rust_build == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          # /mnt is the larger ephemeral disk; the runner user cannot mkdir there.
          sudo mkdir -p /mnt/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/tmp
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # workspaces joins target with path.join(workspace, target), which
          # turns an absolute runner.temp path into
          # $GITHUB_WORKSPACE/home/runner/work/_temp/... and caches emptiness.
          # cache-directories keeps absolute paths as-is.
          cache-targets: "false"
          cache-directories: ${{ runner.temp }}/target-head
          # Full suite runs delete the target dir to free disk; only cache-only
          # mode should write the cache.
          save-if: ${{ env.CACHE_RUST_BUILD == 'true' }}

      - name: Build constellation (Rust cache)
        if: env.CACHE_RUST_BUILD == 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" cargo build --release -p constellation

      - name: Install runtime dependencies
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 rsync python3

      - name: Resolve inputs
        if: env.CACHE_RUST_BUILD != 'true'
        id: cfg
        run: |
          echo "repetitions=${{ github.event.inputs.repetitions || '1' }}" >> "$GITHUB_OUTPUT"
          echo "seed=${{ github.event.inputs.seed || '42' }}" >> "$GITHUB_OUTPUT"
          # Replaying all 120k files three times takes many hours on a hosted
          # runner and exhausted process/memory resources before rsync could
          # even start. 20k preserves the real corpus shape and is large
          # enough for stable rates while keeping the routine job bounded. A
          # manual dispatch can still request the full 120367-entry corpus.
          echo "corpus_limit=${{ github.event.inputs.corpus_limit || '20000' }}" >> "$GITHUB_OUTPUT"
          # Pushes and PRs always cap; workflow_dispatch can clear the input to use exact sizes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "max_file_bytes=${{ github.event.inputs.max_file_bytes }}" >> "$GITHUB_OUTPUT"
          else
            echo "max_file_bytes=${{ github.event.inputs.max_file_bytes || '2097152' }}" >> "$GITHUB_OUTPUT"
          fi

      # The newest main run that kept results, to compare with.
      - name: Results of main
        if: env.CACHE_RUST_BUILD != 'true' && github.event_name != 'push'
        id: base
        run: |
          mkdir -p perf-artifacts
          for row in $(gh run list --workflow perf-regression.yml --branch main --event push --limit 20 \
              --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            if gh run download "${row%%:*}" --name perf-results --dir perf-artifacts/main 2>/dev/null; then
              cp perf-artifacts/main/head.json perf-artifacts/base.json
              echo "sha=${row#*:}" >>"$GITHUB_OUTPUT"
              echo "run=${row%%:*}" >>"$GITHUB_OUTPUT"
              break
            fi
          done

      # Plan 31 C7: in-process VFS dispatch overhead (< 1 us/op) and per-op
      # allocation ceilings (tests/perf-baseline.json "vfs_bench"). No
      # docker; fails the job on a regression past the section 6.9 targets.
      - name: VFS dispatch gate (vfs-bench)
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" \
            PERF_GATE_VFS_BENCH_ONLY=1 tests/perf-gate.sh

      - name: Build binaries
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" cargo build --release -p constellation -p constellation-harness
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/target-head/release/constellation" "$RUNNER_TEMP/bin/constellation"
          cp "$RUNNER_TEMP/target-head/release/harness" "$RUNNER_TEMP/bin/harness"
          # Free the disk for the suite.
          rm -rf "$RUNNER_TEMP/target-head"
          df -h

      - name: Run the performance suite
        if: env.CACHE_RUST_BUILD != 'true'
        env:
          TMPDIR: /mnt/tmp
        run: |
          mkdir -p "$TMPDIR" perf-artifacts/logs
          EXTRA=()
          if [ -n "${{ steps.cfg.outputs.corpus_limit }}" ]; then
            EXTRA+=(--corpus-limit "${{ steps.cfg.outputs.corpus_limit }}")
          fi
          if [ -n "${{ steps.cfg.outputs.max_file_bytes }}" ]; then
            EXTRA+=(--max-file-bytes "${{ steps.cfg.outputs.max_file_bytes }}")
          fi
          python3 tests/perf_regression/run_suite.py \
            --harness-bin "$RUNNER_TEMP/bin/harness" \
            --constellation-bin "$RUNNER_TEMP/bin/constellation" \
            --out perf-artifacts/head.json \
            --logs-dir perf-artifacts/logs \
            --repetitions "${{ steps.cfg.outputs.repetitions }}" \
            --seed "${{ steps.cfg.outputs.seed }}" \
            --corpus-shape \
            "${EXTRA[@]}"
          df -h

      - name: Report
        if: env.CACHE_RUST_BUILD != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_RUN: ${{ steps.base.outputs.run }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          server=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          meta="commit [\`${SHA::7}\`]($server/commit/$SHA) · [run]($server/actions/runs/$GITHUB_RUN_ID) · GitHub ubuntu-latest runner"
          if [[ -n $BASE_SHA ]]; then
            meta+=" · compared with main at [\`${BASE_SHA::7}\`]($server/actions/runs/$BASE_RUN)"
          fi
          base=()
          if [[ ${{ github.event_name }} != push ]]; then
            base=(--base perf-artifacts/base.json)
          fi
          python3 tests/perf_regression/report.py perf-artifacts/head.json "${base[@]}" --meta "$meta" >perf-artifacts/report.md
          cat perf-artifacts/report.md >>"$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated in place. Pull requests from
      # forks get a read-only token: the job summary has the same report.
      - name: Comment on the pull request
        if: env.CACHE_RUST_BUILD != 'true' && always() && github.event_name == 'pull_request' && hashFiles('perf-artifacts/report.md') != ''
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- perf-regression-report -->"))) | .id' | tail -n 1)
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@perf-artifacts/report.md >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@perf-artifacts/report.md >/dev/null
          fi

      # Results of main, for the pull requests to compare with.
      - name: Keep the results of main
        if: env.CACHE_RUST_BUILD != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-artifacts/head.json
          retention-days: 90

      - name: Upload report and logs (14-day retention)
        if: env.CACHE_RUST_BUILD != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            perf-artifacts/head.json
            perf-artifacts/report.md
            perf-artifacts/logs/
