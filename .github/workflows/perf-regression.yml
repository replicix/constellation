name: Performance Regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref for comparison (branch, tag, or SHA)"
        required: false
        default: "main"
      repetitions:
        description: "Repetitions per profile (median reported)"
        required: false
        default: "1"
      seed:
        description: "Corpus replay seed"
        required: false
        default: "42"
      corpus_limit:
        description: "Max files to replay from the corpus (empty = all)"
        required: false
        default: ""
      max_file_bytes:
        description: "Cap each staged file size (bytes). Default 2MiB keeps tree shape on runner disk."
        required: false
        default: "2097152"
      cache_rust_build:
        description: "Only build constellation and save the Rust cache (skip the suite)"
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CACHE_RUST_BUILD: ${{ github.event.inputs.cache_rust_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          # /mnt is the larger ephemeral disk; the runner user cannot mkdir there.
          sudo mkdir -p /mnt/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/tmp
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ${{ runner.temp }}/target-head"
          # Full suite runs delete the target dir to free disk; only cache-only
          # mode should write the cache, and it should persist even if later
          # suite runs fail (cache-on-failure is irrelevant there).
          save-if: ${{ env.CACHE_RUST_BUILD == 'true' }}

      - name: Build constellation (Rust cache)
        if: env.CACHE_RUST_BUILD == 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" cargo build --release -p constellation

      - name: Install runtime dependencies
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 rsync python3

      - name: Resolve inputs
        if: env.CACHE_RUST_BUILD != 'true'
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=${{ github.event.inputs.base_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "repetitions=${{ github.event.inputs.repetitions || '1' }}" >> "$GITHUB_OUTPUT"
          echo "seed=${{ github.event.inputs.seed || '42' }}" >> "$GITHUB_OUTPUT"
          echo "corpus_limit=${{ github.event.inputs.corpus_limit || '' }}" >> "$GITHUB_OUTPUT"
          # PRs always cap; workflow_dispatch can clear the input to use exact sizes.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "max_file_bytes=${{ github.event.inputs.max_file_bytes || '2097152' }}" >> "$GITHUB_OUTPUT"
          else
            echo "max_file_bytes=${{ github.event.inputs.max_file_bytes }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch baseline from base ref
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          mkdir -p perf-artifacts
          base_ref="${{ steps.cfg.outputs.base_ref }}"
          if git show "${base_ref}:.perf-baselines/result.json" > perf-artifacts/base.json 2>/dev/null; then
            echo "Found existing baseline in ${base_ref}"
            echo "baseline_exists=true" >> "$GITHUB_ENV"
          else
            echo "No baseline found in ${base_ref}, will generate"
            echo "baseline_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Build HEAD binaries
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" cargo build --release -p constellation -p constellation-harness
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/target-head/release/constellation" "$RUNNER_TEMP/bin/constellation-head"
          cp "$RUNNER_TEMP/target-head/release/harness" "$RUNNER_TEMP/bin/harness"
          rm -rf "$RUNNER_TEMP/target-head"
          df -h

      - name: Prepare BASE worktree
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          git fetch --no-tags --depth 1 origin "${{ steps.cfg.outputs.base_ref }}"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD

      - name: Build BASE binaries
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          cd "$RUNNER_TEMP/base"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" cargo build --release -p constellation
          cp "$RUNNER_TEMP/target-base/release/constellation" "$RUNNER_TEMP/bin/constellation-base"
          rm -rf "$RUNNER_TEMP/target-base" "$RUNNER_TEMP/base"
          df -h

      - name: Run HEAD performance suite
        if: env.CACHE_RUST_BUILD != 'true'
        env:
          TMPDIR: /mnt/tmp
        run: |
          mkdir -p "$TMPDIR" perf-artifacts/head-logs
          EXTRA=()
          if [ -n "${{ steps.cfg.outputs.corpus_limit }}" ]; then
            EXTRA+=(--corpus-limit "${{ steps.cfg.outputs.corpus_limit }}")
          fi
          if [ -n "${{ steps.cfg.outputs.max_file_bytes }}" ]; then
            EXTRA+=(--max-file-bytes "${{ steps.cfg.outputs.max_file_bytes }}")
          fi
          python3 tests/perf_regression/run_suite.py \
            --harness-bin "$RUNNER_TEMP/bin/harness" \
            --constellation-bin "$RUNNER_TEMP/bin/constellation-head" \
            --out perf-artifacts/head.json \
            --logs-dir perf-artifacts/head-logs \
            --repetitions "${{ steps.cfg.outputs.repetitions }}" \
            --seed "${{ steps.cfg.outputs.seed }}" \
            --corpus-shape \
            "${EXTRA[@]}"
          df -h

      - name: Run BASE performance suite
        if: env.CACHE_RUST_BUILD != 'true' && env.baseline_exists == 'false'
        env:
          TMPDIR: /mnt/tmp
        run: |
          mkdir -p "$TMPDIR" perf-artifacts/base-logs
          EXTRA=()
          if [ -n "${{ steps.cfg.outputs.corpus_limit }}" ]; then
            EXTRA+=(--corpus-limit "${{ steps.cfg.outputs.corpus_limit }}")
          fi
          if [ -n "${{ steps.cfg.outputs.max_file_bytes }}" ]; then
            EXTRA+=(--max-file-bytes "${{ steps.cfg.outputs.max_file_bytes }}")
          fi
          python3 tests/perf_regression/run_suite.py \
            --harness-bin "$RUNNER_TEMP/bin/harness" \
            --constellation-bin "$RUNNER_TEMP/bin/constellation-base" \
            --out perf-artifacts/base.json \
            --logs-dir perf-artifacts/base-logs \
            --repetitions "${{ steps.cfg.outputs.repetitions }}" \
            --seed "${{ steps.cfg.outputs.seed }}" \
            --corpus-shape \
            "${EXTRA[@]}"
          df -h

      - name: Commit baseline to current branch
        if: env.CACHE_RUST_BUILD != 'true' && success() && github.event_name == 'pull_request'
        run: |
          mkdir -p .perf-baselines
          cp perf-artifacts/head.json .perf-baselines/result.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .perf-baselines/result.json

          if git diff --staged --quiet; then
            echo "No changes to baseline"
          else
            git commit -m "Update performance baseline [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Render markdown comparison
        if: env.CACHE_RUST_BUILD != 'true'
        run: |
          python3 tests/perf_regression/compare.py \
            --base perf-artifacts/base.json \
            --head perf-artifacts/head.json \
            --out perf-artifacts/report.md
          cat perf-artifacts/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: env.CACHE_RUST_BUILD != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-regression-report -->';
            const body = marker + '\n' + fs.readFileSync('perf-artifacts/report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload comparison report (14-day retention)
        if: env.CACHE_RUST_BUILD != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_id }}
          retention-days: 14
          path: perf-artifacts/report.md

      - name: Upload logs (14-day retention)
        if: env.CACHE_RUST_BUILD != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            perf-artifacts/base-logs/
            perf-artifacts/head-logs/
