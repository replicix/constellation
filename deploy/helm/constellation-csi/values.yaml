# Values for the constellation-csi chart (plan 37 §14).

# The CSI driver name; StorageClass.provisioner and VolumeSnapshotClass.driver
# must carry exactly this (plan 37 settled decision 2).
driverName: csi.constellation.dev

image:
  # One image carries constellation-csi (--controller / --node) and the
  # `constellation` engine binary the node plugin starts as engine pods.
  repository: constellation-csi
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Sidecars, pinned to the versions plan 37 §14 verified.
sidecars:
  registry: registry.k8s.io/sig-storage
  nodeDriverRegistrar: {image: csi-node-driver-registrar, tag: v2.18.0}
  livenessprobe: {image: livenessprobe, tag: v2.20.0}
  # Controller sidecars. Each renders with its upstream RBAC
  # (templates/rbac.yaml). The snapshotter stays off until K4 implements
  # the snapshot RPCs.
  provisioner: {enabled: true, image: csi-provisioner, tag: v6.3.0}
  resizer: {enabled: true, image: csi-resizer, tag: v2.2.1}
  snapshotter: {enabled: false, image: csi-snapshotter, tag: v8.6.0}
  # How long a sidecar waits for one Controller RPC. The first CreateVolume
  # of a pool starts that pool's engine pod and waits for it to become
  # ready, which takes longer than the sidecars' 10s default.
  timeout: 120s

# kubelet's root directory on the node (the registrar and staging paths hang
# off it). Non-default distributions (k0s, microk8s, ...) override this.
kubeletDir: /var/lib/kubelet

# hostPath root of the node-local layout (plan 37 §7): node-identity/,
# sockets/<unit>/{fd-handoff,control}.sock.
hostRoot: /var/lib/constellation-csi
# Where engine pods' control sockets live; the control-acl service grant's
# socket_glob must match <controlSocketRoot>/*/control.sock.
controlSocketRoot: /var/lib/constellation-csi/sockets

# Engine pods (plan 37 §7). The controller starts one controller-owned
# engine pod per pool filesystem (K2); the node plugin starts node-owned
# ones from K3 on. `resources` applies to both; the rest is the node
# plugin's (K3/K5).
engineProfile:
  idleTtl: 10m
  handoffDrainTimeout: 30s
  handoffTotalTimeout: 120s
  # How long a controller RPC waits for a pool's engine pod to become
  # ready (image pull, first start), in seconds. Keep it below
  # sidecars.timeout, so the RPC fails with the pod's waiting reason
  # (ErrImagePull, ...) before the sidecar's own deadline cuts it off.
  readyTimeout: 100
  logLevel: info
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

# StorageClasses to create with the chart (plan 37 §6). Each entry is a
# name, the class parameters, and the optional standard fields. The
# Secret named by the csi.storage.k8s.io/provisioner-secret-* parameters
# holds aws_access_key_id / aws_secret_access_key (and e2e_passphrase for
# an e2e pool); omit those parameters for credentialSource:
# aws-default-chain (IRSA / EKS Pod Identity on the engine pods).
#
# The provisioner secret must live in the driver's namespace (this
# release's): external-provisioner reads it with the controller's
# ServiceAccount, which may read Secrets only here (plan 37 §9), so a
# class naming a secret in another namespace (`tenant-a`, or
# `${pvc.namespace}`) fails CreateVolume with `forbidden`. Cross-namespace
# secrets come with 37-k6a's scoped rule.
#
# storageClasses:
#   - name: constellation-rwx
#     parameters:
#       bucket: constellation-csi-pool
#       prefix: constellation-csi/constellation-rwx
#       # endpoint: https://s3.us-west-2.amazonaws.com
#       # region: us-west-2
#       layout: pool
#       shards: "1"
#       csi.storage.k8s.io/provisioner-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/provisioner-secret-namespace: constellation-csi
#       csi.storage.k8s.io/controller-expand-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/controller-expand-secret-namespace: constellation-csi
#     reclaimPolicy: Delete
#     allowVolumeExpansion: true
#     volumeBindingMode: Immediate
storageClasses: []

# Purge worker (controller; K4).
purge:
  interval: 1h
  grace: 24h
  maxConcurrentDeletes: 4

controller:
  replicas: 2
  # A ValidatingAdmissionPolicy (Kubernetes >= 1.30) holding the controller
  # ServiceAccount's pod create/patch/delete/exec to its own engine pods —
  # without it that ServiceAccount is root-equivalent on every node
  # (templates/exec-policy.yaml, plan 37 §9). Turn off only on clusters
  # older than 1.30.
  podAccessPolicy: true
  leaderElection:
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 5s
  resources:
    csi: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
    sidecar: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  nodeSelector: {}
  tolerations: []
  livenessPort: 9808

node:
  resources:
    csi: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
    sidecar: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  livenessPort: 9809
  # Mounts in running pods depend on the node plugin: schedule it first.
  priorityClassName: system-node-critical
  maxUnavailable: 1

# Log filter (RUST_LOG).
logLevel: info
