# Values for the constellation-csi chart (plan 37 §14).

# The CSI driver name; StorageClass.provisioner and VolumeSnapshotClass.driver
# must carry exactly this (plan 37 settled decision 2).
driverName: csi.constellation.dev

image:
  # One image carries constellation-csi (--controller / --node) and the
  # `constellation` engine binary the node plugin starts as engine pods.
  repository: constellation-csi
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Sidecars, pinned to the versions plan 37 §14 verified.
sidecars:
  registry: registry.k8s.io/sig-storage
  nodeDriverRegistrar: {image: csi-node-driver-registrar, tag: v2.18.0}
  livenessprobe: {image: livenessprobe, tag: v2.20.0}
  # Controller sidecars. Each renders with its upstream RBAC
  # (templates/rbac.yaml). The snapshotter (K4) needs the snapshot CRDs and
  # the cluster-wide snapshot-controller installed first — once per
  # cluster, not by this chart (plan 37 §14; tests/csi/snapshot-crds.sh
  # installs both at the pinned tag). Without them it only logs errors;
  # turn it off on a cluster that will never have them.
  provisioner: {enabled: true, image: csi-provisioner, tag: v6.3.0}
  resizer: {enabled: true, image: csi-resizer, tag: v2.2.1}
  snapshotter: {enabled: true, image: csi-snapshotter, tag: v8.6.0}
  # The three controller sidecars run with
  # --feature-gates=ReleaseLeaderElectionOnExit=true
  # (templates/controller.yaml): a tag older than one that knows the gate
  # (it is in the pinned ones) exits on the unknown gate and crash-loops.
  # How long a sidecar waits for one Controller RPC. The first CreateVolume
  # of a pool starts that pool's engine pod and waits for it to become
  # ready, which takes longer than the sidecars' 10s default.
  timeout: 120s

# kubelet's root directory on the node (the registrar and staging paths hang
# off it). Non-default distributions (k0s, microk8s, ...) override this.
kubeletDir: /var/lib/kubelet

# hostPath root of the node-local layout (plan 37 §7): node-identity/<unit>/
# (an engine pod's meta store), sockets/<unit>/ (its control socket),
# policy/<unit>/ (the node plugin's grant on that socket: root-owned,
# read-only in the pod), volumes/ (the node plugin's staged-volume records).
hostRoot: /var/lib/constellation-csi

# Engine pods (plan 37 §7). The controller starts one controller-owned
# engine pod per pool filesystem (K2); the node plugin starts one per pool
# filesystem per node with a staged volume of it (K3). `resources`,
# `readyTimeout` and `logLevel` apply to both.
engineProfile:
  # Plan 37 §7 (K6b): a node-owned engine pod that has served no volume for
  # this long leaves the pool's registry and is deleted by its node plugin
  # (never while a view is mounted: the plugin asks the pod first). The
  # next volume of its pool on that node starts a new one, as a new node.
  # A duration (90s, 10m, 1h); 0 keeps idle pods (a drain still collects
  # them). The controller-owned pods are exempt: the purge worker reaps
  # one once its pool has no volume left.
  idleTtl: 10m
  # Seconds between the node plugin's idle-GC passes, which also notice a
  # cordoned (draining) node.
  idleGcInterval: 30
  # Plan 37 §8 (K5): when `image` or an engine setting here changes, each
  # node plugin replaces its engine pods one at a time by handing their
  # FUSE sessions to the replacement — a stall for writers, never ENOTCONN.
  handoff:
    # How long the old engine may drain the requests it already accepted
    # (K0: a 10 s pause only delays callers, so this is a liveness bound).
    drainTimeoutMs: 5000
    # Every step up to the commit; the old engine serves again by itself
    # (and refuses a commit) a few seconds after it.
    totalTimeoutMs: 30000
    # After the commit, how long the replacement may take to serve before
    # the rollout leaves it pending (it then holds the only copies of the
    # sessions, so it is waited for, never deleted on a timeout).
    resumeTimeoutMs: 300000
    # Attempts per pod and spec before the rollout leaves the old pod
    # serving (an event and the constellation.dev/handoff-fallback
    # annotation say so; its volumes move at the next republish).
    maxAttempts: 3
    # Seconds between rollout passes (and at the plugin's start); 0: off.
    rolloutInterval: 30
  # How long a controller RPC (or NodeStageVolume) waits for a pool's
  # engine pod to become ready (image pull, first start), in seconds. Keep
  # it below sidecars.timeout (and kubelet's 2 min staging timeout), so the
  # RPC fails with the pod's waiting reason (ErrImagePull, ...) before the
  # caller's own deadline cuts it off.
  readyTimeout: 100
  logLevel: info
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

# StorageClasses to create with the chart (plan 37 §6). Each entry is a
# name, the class parameters, and the optional standard fields.
#
# Credentials (plan 37 §9, `credentialSource`): whatever the source, they
# reach an engine pod only as `fs.unlock` over its control socket — never
# in its pod spec, its environment, its image or a hostPath file.
# - `static-ephemeral` (default): the Secret named by the
#   csi.storage.k8s.io/{provisioner,node-stage,controller-expand}-secret-*
#   parameters holds aws_access_key_id / aws_secret_access_key (and
#   e2e_passphrase for an e2e pool); the sidecars and kubelet resolve it
#   per request. A changed Secret reaches running engine pods with the
#   next request that carries it.
# - `refreshing`: as static-ephemeral, plus `credentialSecretName` /
#   `credentialSecretNamespace` naming the same Secret, which the plugins
#   watch and push to running engine pods on every change (rotation with
#   no remount). List that Secret under credentials.watchedSecrets below.
# - `aws-default-chain`: no secret parameters; the engine pods' own
#   ServiceAccount (IRSA / EKS Pod Identity). An e2e class still needs
#   node-stage/provisioner secrets carrying e2e_passphrase.
#
# The provisioner secret must live in the driver's namespace (this
# release's): external-provisioner reads it with the controller's
# ServiceAccount, which may read Secrets only here (plan 37 §9), so a
# class naming a secret in another namespace (`tenant-a`, or
# `${pvc.namespace}`) fails CreateVolume with `forbidden`.
#
# storageClasses:
#   - name: constellation-rwx
#     parameters:
#       bucket: constellation-csi-pool
#       prefix: constellation-csi/constellation-rwx
#       # endpoint: https://s3.us-west-2.amazonaws.com
#       # region: us-west-2
#       layout: pool
#       shards: "1"
#       credentialSource: refreshing
#       credentialSecretName: constellation-s3-creds
#       credentialSecretNamespace: constellation-csi
#       csi.storage.k8s.io/provisioner-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/provisioner-secret-namespace: constellation-csi
#       csi.storage.k8s.io/node-stage-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/node-stage-secret-namespace: constellation-csi
#       csi.storage.k8s.io/node-publish-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/node-publish-secret-namespace: constellation-csi
#       csi.storage.k8s.io/controller-expand-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/controller-expand-secret-namespace: constellation-csi
#     reclaimPolicy: Delete
#     allowVolumeExpansion: true
#     volumeBindingMode: Immediate
storageClasses: []

# VolumeSnapshotClasses to create with the chart (plan 37 §6; needs the
# snapshot CRDs, see sidecars.snapshotter). A snapshot is a held
# Constellation snapshot of the volume's subtree, taken through the pool's
# engine pod, which the controller has usually unlocked already. Name the
# pool's Secret as the snapshotter secret anyway: a controller that
# restarted since, facing an engine pod waiting for its credentials, unlocks
# it from the request (plan 37 §9). A clone or restore (a PVC with a
# dataSource) must use a StorageClass of the source's own pool (plan 37
# settled decision 8).
#
# volumeSnapshotClasses:
#   - name: constellation-snapshots
#     deletionPolicy: Delete
#     parameters:
#       csi.storage.k8s.io/snapshotter-secret-name: constellation-s3-creds
#       csi.storage.k8s.io/snapshotter-secret-namespace: constellation-csi
volumeSnapshotClasses: []

# The engine pods' ServiceAccount (`constellation-csi-engine`, bound to no
# Role, no token mounted). For `credentialSource: aws-default-chain` give it
# IRSA's annotation (`eks.amazonaws.com/role-arn: arn:aws:iam::…:role/…`), or
# an EKS Pod Identity association: the EKS webhook then projects a token into
# every engine pod, which the pod-access policies admit (and nothing else).
engineServiceAccount:
  annotations: {}

credentials:
  # The Secrets `credentialSource: refreshing` classes watch, as
  # {namespace, name}: both plugins may get/list/watch exactly these
  # (templates/rbac.yaml), nothing else.
  #   - {namespace: constellation-csi, name: constellation-s3-creds}
  watchedSecrets: []

# Purge worker (plan 37 §"Deletion and purge", K6b; crates/csi/src/purge.rs):
# the controller replica holding the constellation-csi-purge Lease walks
# every pool's /.trash every `interval` and removes the entries trashed
# more than `grace` ago, a file at a time, through the pool's
# controller-owned engine pod. The budgets are per pool: unlinks and rmdirs
# per second, file bytes per second (0: unpaced), and unlinks in flight.
# The worker brings back the pod of any pool with volumes or trash (a drain
# or node loss takes it with nobody asking; the constellation-csi-pools
# ConfigMap remembers the pools whose last PV is gone), and reaps the pod
# of a pool left with neither. interval 0 turns the worker off (a pod a
# DeleteVolume started is then stopped again right away).
purge:
  interval: 5m
  grace: 1m
  maxConcurrentDeletes: 4
  opsPerSecond: 500
  bytesPerSecond: 256Mi

controller:
  replicas: 2
  # A ValidatingAdmissionPolicy (Kubernetes >= 1.30) holding the controller
  # ServiceAccount's pod create/patch/delete/exec to its own engine pods —
  # without it that ServiceAccount is root-equivalent on every node
  # (templates/exec-policy.yaml, plan 37 §9). Turn off only on clusters
  # older than 1.30.
  podAccessPolicy: true
  # The sidecars' leader election, and the controller's own purge Lease.
  # A stopping sidecar releases its Lease (templates/controller.yaml), so
  # after a rollout the new leader is the first standby to retry: within
  # 2.2 x retryPeriod (client-go's jitter). kube-controller-manager's 2s.
  leaderElection:
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
  resources:
    csi: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
    sidecar: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  nodeSelector: {}
  tolerations: []
  livenessPort: 9808

node:
  # The node plugin's half of the pod-access policy (templates/exec-policy.yaml):
  # its ServiceAccount may create, annotate and delete only engine pods on
  # its own node, shaped exactly as the plugin builds them. Kubernetes >= 1.30,
  # with bound service-account tokens that carry the node name (beta and on by
  # default from 1.30, GA in 1.32); a token without one is refused.
  podAccessPolicy: true
  resources:
    csi: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
    sidecar: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  livenessPort: 9809
  # The handoff counters (constellation_csi_handoff_*) as Prometheus text
  # at GET /metrics on this port of the node plugin's pod (a `metrics`
  # containerPort); 0: off. Opt-in: nothing scrapes it by default.
  metricsPort: 0
  # Mounts in running pods depend on the node plugin: schedule it first.
  priorityClassName: system-node-critical
  maxUnavailable: 1
  # Plan 37 §7 "Drain" (K6b). `kubectl drain --ignore-daemonsets --force`
  # evicts the workload pods but not the node-owned engine pods (a
  # PodDisruptionBudget refuses their eviction): the node plugin, seeing the
  # node cordoned, has each engine pod whose views are gone leave the
  # pool's registry and deletes it, and the drain then completes. The
  # plugin's preStop waits up to this long for the same on a draining node.
  drain:
    preStopTimeoutSeconds: 300
    # The PodDisruptionBudget over node-owned engine pods. Turn off only if
    # something else orders engine pods after their workloads.
    engineDisruptionBudget: true

# Log filter (RUST_LOG).
logLevel: info

# `helm test` (templates/tests/volume-roundtrip.yaml): a PVC of this
# StorageClass, a pod that writes and reads back 4 MiB through it, then a
# second pod that mounts it afresh, checks it, empties it; Helm deletes all
# three when the test passes (the volume goes to the pool's trash). Default:
# the first class of `storageClasses`. With neither, `helm test` fails,
# saying so — there is nothing to check.
tests:
  storageClassName: ""
  size: 64Mi
