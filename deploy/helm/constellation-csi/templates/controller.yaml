# Controller Deployment (plan 37 §4). Unprivileged. The provisioner and
# resizer sidecars drive the Controller service (K2); the snapshotter is
# K4's (sidecars.*.enabled). Each takes leader election, so replicas: 2 is
# active/standby. The controller starts and reaches the controller-owned
# engine pods (§7) through the Kubernetes API (templates/rbac.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: constellation-csi-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: constellation-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: constellation-csi
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: constellation-csi-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread the active/standby replicas so one node loss keeps a leader.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: constellation-csi
                    app.kubernetes.io/component: controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: constellation-csi
          image: {{ include "csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --controller
            - --endpoint=unix:///csi/csi.sock
          env:
            - {name: RUST_LOG, value: {{ .Values.logLevel | quote }}}
            - name: CONSTELLATION_CSI_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: CONSTELLATION_CSI_ENGINE_IMAGE, value: {{ include "csi.image" . | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_PULL_POLICY, value: {{ .Values.image.pullPolicy | quote }}}
            - {name: CONSTELLATION_CSI_HOST_ROOT, value: {{ .Values.hostRoot | quote }}}
            - {name: CONSTELLATION_CSI_OWNER_DEPLOYMENT, value: constellation-csi-controller}
            - {name: CONSTELLATION_CSI_ENGINE_SERVICE_ACCOUNT, value: constellation-csi-engine}
            - {name: CONSTELLATION_CSI_ENGINE_RESOURCES, value: {{ .Values.engineProfile.resources | toJson | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_LOG_LEVEL, value: {{ .Values.engineProfile.logLevel | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_READY_TIMEOUT_S, value: {{ .Values.engineProfile.readyTimeout | quote }}}
          securityContext: &unpriv
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources: {{- toYaml .Values.controller.resources.csi | nindent 12 }}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: liveness-probe
          image: {{ include "csi.sidecar" (dict "root" . "sc" .Values.sidecars.livenessprobe) }}
          args:
            - --csi-address=/csi/csi.sock
            - --health-port={{ .Values.controller.livenessPort }}
          ports:
            - {name: healthz, containerPort: {{ .Values.controller.livenessPort }}, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: healthz}
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          securityContext: *unpriv
          resources: {{- toYaml .Values.controller.resources.sidecar | nindent 12 }}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        {{- range $name, $sc := dict "csi-provisioner" .Values.sidecars.provisioner "csi-resizer" .Values.sidecars.resizer "csi-snapshotter" .Values.sidecars.snapshotter }}
        {{- if $sc.enabled }}
        - name: {{ $name }}
          image: {{ include "csi.sidecar" (dict "root" $ "sc" $sc) }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $.Release.Namespace }}
            - --leader-election-lease-duration={{ $.Values.controller.leaderElection.leaseDuration }}
            - --leader-election-renew-deadline={{ $.Values.controller.leaderElection.renewDeadline }}
            - --leader-election-retry-period={{ $.Values.controller.leaderElection.retryPeriod }}
            - --timeout={{ $.Values.sidecars.timeout }}
            {{- if eq $name "csi-provisioner" }}
            # csi.storage.k8s.io/pvc/{name,namespace} in CreateVolume
            # parameters: the volume record's pvc/namespace xattrs.
            - --extra-create-metadata
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources: {{- toYaml $.Values.controller.resources.sidecar | nindent 12 }}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        {{- end }}
        {{- end }}
      volumes:
        - {name: socket-dir, emptyDir: {}}
