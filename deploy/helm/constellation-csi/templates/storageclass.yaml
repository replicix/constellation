{{- /* Plan 37 §6: StorageClasses listed in .Values.storageClasses. */}}
{{- range .Values.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
provisioner: {{ $.Values.driverName }}
{{- /* StorageClass parameters are strings: `shards: 4` in a values file is a
number, which the API server refuses in a StorageClass. */}}
parameters:
  {{- range $key, $value := .parameters }}
  {{ $key | quote }}: {{ include "csi.str" $value | quote }}
  {{- end }}
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
allowVolumeExpansion: {{ if hasKey . "allowVolumeExpansion" }}{{ .allowVolumeExpansion }}{{ else }}true{{ end }}
volumeBindingMode: {{ .volumeBindingMode | default "Immediate" }}
{{- with .mountOptions }}
mountOptions: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- /* Plan 37 §6: VolumeSnapshotClasses listed in .Values.volumeSnapshotClasses. */}}
{{- range .Values.volumeSnapshotClasses }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .name }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
driver: {{ $.Values.driverName }}
deletionPolicy: {{ .deletionPolicy | default "Delete" }}
{{- with .parameters }}
parameters:
  {{- range $key, $value := . }}
  {{ $key | quote }}: {{ include "csi.str" $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
