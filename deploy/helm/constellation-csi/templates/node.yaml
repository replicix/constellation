# Node DaemonSet (plan 37 §4, §9): the only privileged workload. It calls
# mount(2) for the FUSE staging mount, so the kubelet directories carry
# Bidirectional propagation back out to the host. It starts this node's
# engine pods (constellation-engine-<unit>-<node>, §7) and reaches them
# through their hostPath control sockets under hostRoot; it runs as uid 0,
# which the service grant it writes into each pod's root-owned
# <hostRoot>/policy/<unit>/ admits (crates/csi/src/engine_pods.rs,
# NodeEnginePods). It holds no permission on Secrets but get/list/watch on
# the ones credentials.watchedSecrets names (`refreshing` classes); the
# credentials it hands an engine pod travel only as `fs.unlock` over that
# socket. It also makes each engine pod's state and socket directories,
# owned by the engine's uid, before creating the pod (no root init
# container in an engine pod).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: constellation-csi-node
  namespace: {{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: constellation-csi
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: {{ include "csi.str" .Values.node.maxUnavailable }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: constellation-csi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: constellation-csi-node
      priorityClassName: {{ .Values.node.priorityClassName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Plan 37 §7 "Drain" (K6b): on a draining node the preStop hook waits
      # until this plugin has collected every engine pod of the node (each
      # leaves the pool's registry first); the grace period must cover it.
      terminationGracePeriodSeconds: {{ add (include "csi.str" .Values.node.drain.preStopTimeoutSeconds | int64) 30 }}
      containers:
        - name: constellation-csi
          image: {{ include "csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/local/bin/constellation-csi
                  - --node
                  - --pre-stop
                  - --endpoint=unix:///csi/csi.sock
                  - --host-root={{ .Values.hostRoot }}
          args:
            - --node
            - --node-id=$(NODE_NAME)
            - --endpoint=unix:///csi/csi.sock
            - --host-root={{ .Values.hostRoot }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: RUST_LOG, value: {{ .Values.logLevel | quote }}}
            - name: CONSTELLATION_CSI_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: CONSTELLATION_CSI_ENGINE_IMAGE, value: {{ include "csi.image" . | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_PULL_POLICY, value: {{ .Values.image.pullPolicy | quote }}}
            - {name: CONSTELLATION_CSI_OWNER_DAEMONSET, value: constellation-csi-node}
            - {name: CONSTELLATION_CSI_ENGINE_SERVICE_ACCOUNT, value: constellation-csi-engine}
            - {name: CONSTELLATION_CSI_ENGINE_RESOURCES, value: {{ .Values.engineProfile.resources | toJson | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_LOG_LEVEL, value: {{ .Values.engineProfile.logLevel | quote }}}
            - {name: CONSTELLATION_CSI_ENGINE_READY_TIMEOUT_S, value: {{ include "csi.str" .Values.engineProfile.readyTimeout | quote }}}
            # Plan 37 §8: engine-pod rollouts by FUSE session handoff.
            - {name: CONSTELLATION_CSI_HANDOFF_DRAIN_TIMEOUT_MS, value: {{ include "csi.str" .Values.engineProfile.handoff.drainTimeoutMs | quote }}}
            - {name: CONSTELLATION_CSI_HANDOFF_TOTAL_TIMEOUT_MS, value: {{ include "csi.str" .Values.engineProfile.handoff.totalTimeoutMs | quote }}}
            - {name: CONSTELLATION_CSI_HANDOFF_RESUME_TIMEOUT_MS, value: {{ include "csi.str" .Values.engineProfile.handoff.resumeTimeoutMs | quote }}}
            - {name: CONSTELLATION_CSI_HANDOFF_MAX_ATTEMPTS, value: {{ include "csi.str" .Values.engineProfile.handoff.maxAttempts | quote }}}
            - {name: CONSTELLATION_CSI_ROLLOUT_INTERVAL_S, value: {{ include "csi.str" .Values.engineProfile.handoff.rolloutInterval | quote }}}
            # Plan 37 §7 (K6b): idle GC and drain (crates/csi/src/node/gc.rs).
            - {name: CONSTELLATION_CSI_ENGINE_IDLE_TTL, value: {{ include "csi.str" .Values.engineProfile.idleTtl | quote }}}
            - {name: CONSTELLATION_CSI_IDLE_GC_INTERVAL_S, value: {{ include "csi.str" .Values.engineProfile.idleGcInterval | quote }}}
            - {name: CONSTELLATION_CSI_PRESTOP_TIMEOUT_S, value: {{ include "csi.str" .Values.node.drain.preStopTimeoutSeconds | quote }}}
            {{- if .Values.node.metricsPort }}
            - {name: CONSTELLATION_CSI_METRICS_ADDR, value: {{ printf "0.0.0.0:%s" (include "csi.str" .Values.node.metricsPort) | quote }}}
            {{- end }}
          {{- if .Values.node.metricsPort }}
          ports:
            - {name: metrics, containerPort: {{ include "csi.str" .Values.node.metricsPort }}, protocol: TCP}
          {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          resources: {{- toYaml .Values.node.resources.csi | nindent 12 }}
          volumeMounts:
            - {name: plugin-dir, mountPath: /csi, mountPropagation: Bidirectional}
            # kubelet hands out staging_target_path under plugins/ and
            # target_path under pods/: both must resolve at the host path.
            - {name: kubelet-dir, mountPath: {{ .Values.kubeletDir }}, mountPropagation: Bidirectional}
            # §7 staging/ mounts made here must reach the host too.
            - {name: host-root, mountPath: {{ .Values.hostRoot }}, mountPropagation: Bidirectional}
            - {name: dev-fuse, mountPath: /dev/fuse}
        - name: node-driver-registrar
          image: {{ include "csi.sidecar" (dict "root" . "sc" .Values.sidecars.nodeDriverRegistrar) }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ include "csi.pluginDir" . }}/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.node.resources.sidecar | nindent 12 }}
          volumeMounts:
            - {name: plugin-dir, mountPath: /csi}
            - {name: registration-dir, mountPath: /registration}
        - name: liveness-probe
          image: {{ include "csi.sidecar" (dict "root" . "sc" .Values.sidecars.livenessprobe) }}
          args:
            - --csi-address=/csi/csi.sock
            - --health-port={{ include "csi.str" .Values.node.livenessPort }}
          ports:
            - {name: healthz, containerPort: {{ include "csi.str" .Values.node.livenessPort }}, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: healthz}
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.node.resources.sidecar | nindent 12 }}
          volumeMounts:
            - {name: plugin-dir, mountPath: /csi}
      volumes:
        - name: plugin-dir
          hostPath: {path: {{ include "csi.pluginDir" . }}, type: DirectoryOrCreate}
        - name: registration-dir
          hostPath: {path: {{ .Values.kubeletDir }}/plugins_registry, type: Directory}
        - name: kubelet-dir
          hostPath: {path: {{ .Values.kubeletDir }}, type: Directory}
        - name: host-root
          hostPath: {path: {{ .Values.hostRoot }}, type: DirectoryOrCreate}
        - name: dev-fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
