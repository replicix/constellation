apiVersion: v1
kind: ServiceAccount
metadata:
  name: constellation-csi-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: constellation-csi-node
  namespace: {{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
---
# Plan 37 §9: every engine pod's (both roles'). No Role binds it and no
# token is mounted; the pod-access policies (templates/exec-policy.yaml)
# admit an engine pod only under this name, so a stolen controller or node
# token cannot run one as a ServiceAccount that holds permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: constellation-csi-engine
  namespace: {{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
  {{- with .Values.engineServiceAccount.annotations }}
  # credentialSource: aws-default-chain (IRSA's eks.amazonaws.com/role-arn):
  # the EKS webhook projects a token into the engine pods; plan 37 §9.
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
