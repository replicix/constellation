# Plan 37 §9. Engine-pod lifecycle: pods, namespace-scoped (never
# cluster-wide pod creation). PV/PVC read for the observability labels.
# No cluster-wide Secret read: the sidecars and kubelet resolve
# `*-secret-name` and pass the bytes in the request, and the plugins hand
# them to an engine pod only as `fs.unlock` over its control socket
# (37-k6a: nothing in a pod spec, an environment or a Secret the driver
# writes).
#
# The node plugin additionally (37-k3a): `pods` patch (its engine pods'
# view-count annotations, §7), `daemonsets` get on its own DaemonSet
# (the engine pods' owner), and (37-k5a) `events` create: an engine-pod
# handoff and a rollout's fallback are reported on the pod (§8, §10). No
# Secret permission but the watched ones below: a replacement engine pod
# gets its credentials from the pod it replaces, over the handoff (37-k6a),
# never from a Secret. It never execs: it reaches its engine pods through
# their hostPath sockets.
#
# The controller additionally (37-k2b, crates/csi/src/engine_pods.rs):
# - `pods` patch: labels a controller-owned engine pod with the filesystem
#   uuid it serves, which is how DeleteVolume/ControllerExpandVolume find it;
# - `pods/exec` create/get: the controller reaches an engine pod's control
#   socket through an exec relay, and this grant *is* that channel's
#   authorization (no network listener exists);
# - `secrets` get, in this namespace only: what external-provisioner and
#   external-resizer (running as this ServiceAccount) read to resolve a
#   class's provisioner/controller-expand secret — and what a rebuild of a
#   lost engine pod reads. Never create or update (37-k6a removed the
#   per-pool credentials Secret K2 wrote);
# - `deployments` get: the controller Deployment's uid, for the engine
#   pods' ownerReferences;
# - `persistentvolumes` list and `storageclasses` get (cluster-wide): a
#   DeleteVolume/ControllerExpandVolume whose engine pod is gone and whose
#   spec this process never saw (a reinstall, a restart) rebuilds the pod
#   from a PV naming the filesystem and that PV's StorageClass;
# - `persistentvolumes` and `volumesnapshotcontents` list (cluster-wide,
#   K4): a DeleteVolume/DeleteSnapshot with no engine pod up asks whether
#   the PV/content still exists, and starts nothing when it does not (a
#   delete the sidecar repeats after it succeeded).
#
# `pods/exec` + `pods` create in this (PodSecurity `privileged`) namespace
# would make this ServiceAccount root-equivalent on every node (exec into
# the privileged node-plugin pods, or create a privileged pod). The
# ValidatingAdmissionPolicies in templates/exec-policy.yaml narrow both to
# controller-owned engine pods of exactly the engine shape, and exec to the
# control relay's command; see plan 37 §9. Engine pods run as the
# `constellation-csi-engine` ServiceAccount, which nothing here binds.
#
# `credentials.watchedSecrets` (37-k6a, `credentialSource: refreshing`):
# both plugins get `get`/`list`/`watch` on exactly those Secrets, by name
# (`resourceNames`; the plugins list and watch with a `metadata.name` field
# selector, which RBAC authorizes against the name), in each Secret's own
# namespace — never a namespace's Secrets, never cluster-wide.
{{- range $role := list "controller" "node" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: constellation-csi-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  {{- if eq $role "node" }}
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [constellation-csi-node]
    verbs: [get]
  # Plan 37 §8: a rollout's handoff and its fallback, on the engine pod.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  {{- end }}
  {{- if eq $role "controller" }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    # `get`: the exec stream is a WebSocket upgrade of a GET request.
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [constellation-csi-controller]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: constellation-csi-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: constellation-csi-{{ $role }}}
subjects:
  - {kind: ServiceAccount, name: constellation-csi-{{ $role }}, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: constellation-csi-{{ $role }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes, persistentvolumeclaims]
    verbs: [get]
  {{- if eq $role "controller" }}
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: constellation-csi-{{ $role }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: constellation-csi-{{ $role }}}
subjects:
  - {kind: ServiceAccount, name: constellation-csi-{{ $role }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- /*
Controller sidecars: each upstream rule set unmodified (deploy/kubernetes/
rbac*.yaml at the pinned tag), bound to the controller ServiceAccount, and
rendered only when that sidecar is enabled.
*/}}
{{- $sidecarRules := dict
  "provisioner" (dict
    "cluster" (list
      (dict "apiGroups" (list "") "resources" (list "persistentvolumes") "verbs" (list "get" "list" "watch" "create" "patch" "delete"))
      (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims") "verbs" (list "get" "list" "watch" "update"))
      (dict "apiGroups" (list "storage.k8s.io") "resources" (list "storageclasses") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "list" "watch" "create" "update" "patch"))
      (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshots") "verbs" (list "get" "list" "watch" "update"))
      (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotcontents") "verbs" (list "get" "list"))
      (dict "apiGroups" (list "storage.k8s.io") "resources" (list "csinodes") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "") "resources" (list "nodes") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "storage.k8s.io") "resources" (list "volumeattachments") "verbs" (list "get" "list" "watch")))
    "namespaced" (list
      (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "watch" "list" "delete" "update" "create"))
      (dict "apiGroups" (list "storage.k8s.io") "resources" (list "csistoragecapacities") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
      (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get"))
      (dict "apiGroups" (list "apps") "resources" (list "replicasets") "verbs" (list "get"))))
  "resizer" (dict
    "cluster" (list
      (dict "apiGroups" (list "") "resources" (list "persistentvolumes") "verbs" (list "get" "list" "watch" "patch"))
      (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims/status") "verbs" (list "patch"))
      (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "list" "watch" "create" "update" "patch"))
      (dict "apiGroups" (list "storage.k8s.io") "resources" (list "volumeattributesclasses") "verbs" (list "get" "list" "watch")))
    "namespaced" (list
      (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "watch" "list" "delete" "update" "create"))))
  "snapshotter" (dict
    "cluster" (list
      (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "list" "watch" "create" "update" "patch"))
      (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotclasses") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotcontents") "verbs" (list "get" "list" "watch" "update" "patch"))
      (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotcontents/status") "verbs" (list "update" "patch"))
      (dict "apiGroups" (list "groupsnapshot.storage.k8s.io") "resources" (list "volumegroupsnapshotclasses") "verbs" (list "get" "list" "watch"))
      (dict "apiGroups" (list "groupsnapshot.storage.k8s.io") "resources" (list "volumegroupsnapshotcontents") "verbs" (list "get" "list" "watch" "update" "patch"))
      (dict "apiGroups" (list "groupsnapshot.storage.k8s.io") "resources" (list "volumegroupsnapshotcontents/status") "verbs" (list "update" "patch")))
    "namespaced" (list
      (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "watch" "list" "delete" "update" "create"))))
}}
{{- range $name := list "provisioner" "resizer" "snapshotter" }}
{{- if (index $.Values.sidecars $name).enabled }}
{{- $rules := index $sidecarRules $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: constellation-csi-{{ $name }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
rules: {{- toYaml $rules.cluster | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: constellation-csi-{{ $name }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: constellation-csi-{{ $name }}}
subjects:
  - {kind: ServiceAccount, name: constellation-csi-controller, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: constellation-csi-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
rules: {{- toYaml $rules.namespaced | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: constellation-csi-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: constellation-csi-{{ $name }}}
subjects:
  - {kind: ServiceAccount, name: constellation-csi-controller, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- range $i, $w := .Values.credentials.watchedSecrets }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: constellation-csi-watch-{{ $w.name }}
  namespace: {{ $w.namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $w.name | quote }}]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: constellation-csi-watch-{{ $w.name }}
  namespace: {{ $w.namespace }}
  labels: {{- include "csi.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: constellation-csi-watch-{{ $w.name }}}
subjects:
  - {kind: ServiceAccount, name: constellation-csi-controller, namespace: {{ $.Release.Namespace }}}
  - {kind: ServiceAccount, name: constellation-csi-node, namespace: {{ $.Release.Namespace }}}
{{- end }}
