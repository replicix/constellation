{{- /*
Plan 37 §9: what the controller ServiceAccount may do to pods.

Its Role grants `pods` create/patch/delete and `pods/exec` create in this
namespace, which is PodSecurity `privileged` (the node plugin needs it).
Unrestricted, that is root on every node: exec into a privileged
node-plugin pod, patch its image, or create a privileged pod. RBAC cannot
scope a verb to a name pattern or a label, so this
ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1, Kubernetes
>= 1.30) narrows every pod operation that ServiceAccount makes to
controller-owned engine pods (`constellation-engine-<unit>-controller`),
and every pod it creates to exactly the shape
crates/csi/src/engine_pods.rs builds, as the node plugin's half below
does: this chart's image, one engine container running `constellation
serve` (probes only `constellation control-relay`), no init container,
uid 65532, PodSecurity `restricted`'s container rules (every capability
dropped and none added, no privilege escalation, read-only root,
`RuntimeDefault` seccomp), no host namespace, no runtime class, no
service-account token and the engine ServiceAccount
(`constellation-csi-engine`, which holds no permission), no lifecycle
hook, no environment from anywhere but literal values (37-k6a: the
credentials come by `fs.unlock` over the control socket, never from a
Secret), and only emptyDir volumes (state, socket, scratch), each at its
own path — no hostPath at all — plus, for `credentialSource:
aws-default-chain`, the projected token the EKS IRSA or Pod Identity
webhook injects (csi.awsTokenVolume, _helpers.tpl). A pod update may change metadata (the
fs-uuid label; 37-k6b's hold, retiring and left annotations), never the spec.

The only subresource it may touch is `exec`, the control relay
(engine_pods.rs `ExecRelay`), and admission sees that request's
PodExecOptions (a second policy, below): the command must be the
relay's own (or its `--ping`) in the `engine` container. Admission sees only the exec's pod *name*,
not the pod; the name pattern holds because creating a pod under that
name is itself held to the engine-pod shape above.
*/}}
{{- if .Values.controller.podAccessPolicy }}
{{- $sa := printf "system:serviceaccount:%s:constellation-csi-controller" .Release.Namespace }}
{{- $root := trimSuffix "/" .Values.hostRoot }}
{{- $bin := "/usr/local/bin/constellation" }}
{{- $sock := "/run/constellation-csi/control.sock" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: constellation-csi-controller-pods.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["pods", "pods/*"]
  matchConditions:
    - name: controller-service-account
      expression: request.userInfo.username == {{ $sa | quote }}
  variables:
    - name: subresource
      expression: request.?subResource.orValue('')
    - name: target
      expression: >-
        request.operation == 'CREATE' && variables.subresource == ''
          ? object.metadata.name : request.name
    - name: creating
      expression: request.operation == 'CREATE' && variables.subresource == ''
    - name: unit
      # `<unit>-controller`: the name after `constellation-engine-`, which
      # the first validation pins.
      expression: >-
        variables.target.startsWith('constellation-engine-')
          ? variables.target.substring(21) : ''
    - name: execOk
      # A probe's exec command, if any, is `constellation control-relay …`.
      expression: >-
        [object.spec.containers[0].?startupProbe, object.spec.containers[0].?readinessProbe,
         object.spec.containers[0].?livenessProbe].all(p,
          !p.hasValue() || !has(p.value().exec)
          || (size(p.value().exec.command) >= 2
              && p.value().exec.command[0] == {{ $bin | quote }}
              && p.value().exec.command[1] == 'control-relay'))
  validations:
    - expression: >-
        variables.subresource == 'exec'
          || (variables.subresource == '' && request.operation != 'CONNECT')
      messageExpression: >-
        'the CSI controller touches no pod subresource but exec, not '
        + variables.subresource
    - expression: variables.target.matches('^constellation-engine-[a-z0-9-]+-controller$')
      messageExpression: >-
        'the CSI controller may only touch its own engine pods
        (constellation-engine-*-controller), not ' + variables.target
    - expression: >-
        !variables.creating || (
          has(object.metadata.labels)
          && object.metadata.labels[?'app.kubernetes.io/component'].orValue('') == 'engine'
          && object.metadata.labels[?'constellation.replicix.com/owner'].orValue('') == 'controller')
      message: an engine pod carries the engine/controller labels
    - expression: >-
        !variables.creating || (
          !object.spec.?hostNetwork.orValue(false)
          && !object.spec.?hostPID.orValue(false)
          && !object.spec.?hostIPC.orValue(false)
          && !has(object.spec.ephemeralContainers)
          && !has(object.spec.runtimeClassName)
          && object.spec.?automountServiceAccountToken.orValue(true) == false
          && object.spec.?serviceAccountName.orValue('') == 'constellation-csi-engine'
          && object.spec.?serviceAccount.orValue('constellation-csi-engine') == 'constellation-csi-engine'
          && object.spec.?securityContext.?runAsNonRoot.orValue(false)
          && object.spec.?securityContext.?runAsUser.orValue(0) == 65532)
      message: >-
        an engine pod uses no host namespace, no runtime class and no
        service-account token, runs as the constellation-csi-engine
        ServiceAccount and as uid 65532
    - expression: >-
        !variables.creating || (
          !has(object.spec.initContainers)
          && object.spec.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault'
          && object.spec.containers.all(c,
          c.image == {{ include "csi.image" . | quote }}
          && !c.?securityContext.?privileged.orValue(false)
          && c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false
          && c.?securityContext.?readOnlyRootFilesystem.orValue(false)
          && size(c.?securityContext.?capabilities.?add.orValue([])) == 0
          && c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL')
          && !has(c.lifecycle) && !has(c.envFrom)
          && c.?env.orValue([]).all(e, !has(e.valueFrom))
          && c.?volumeMounts.orValue([]).all(m,
               !has(m.subPath) && !has(m.subPathExpr)
               && m.?mountPropagation.orValue('None') == 'None'
               && ((m.name == 'node-identity' && m.mountPath == '/var/lib/constellation/state')
                   || (m.name == 'sockets' && m.mountPath == '/run/constellation-csi')
                   || (m.name == 'scratch' && m.mountPath == '/tmp')
                   || {{ include "csi.awsTokenMount" . }}))))
      message: >-
        an engine pod has no init container and RuntimeDefault seccomp; its
        containers run this chart's image under PodSecurity restricted's
        rules (no capability, no privilege escalation, read-only root),
        without lifecycle hooks or environment from a Secret, and mount only
        the unit's volumes at their own paths
    - expression: >-
        !variables.creating || (
          size(object.spec.containers) == 1
          && object.spec.containers.all(c,
               c.?command.orValue([]) == [{{ $bin | quote }}]
               && size(c.?args.orValue([])) > 0 && c.args[0] == 'serve'
               && c.?securityContext.?runAsUser.orValue(65532) == 65532
               && !c.?securityContext.?capabilities.?add.hasValue())
          && variables.execOk)
      message: >-
        an engine pod has one container, running `constellation serve` as
        uid 65532 with no added capability, its probes `constellation control-relay`
    - expression: >-
        !variables.creating || object.spec.?volumes.orValue([]).all(v,
          (v.name in ['node-identity', 'sockets', 'scratch']
           && has(v.emptyDir) && !has(v.hostPath))
          || {{ include "csi.awsTokenVolume" . }})
      message: >-
        a controller-owned engine pod's volumes are emptyDirs (state,
        socket, scratch) and at most an EKS projected token: no hostPath
    - expression: >-
        request.operation != 'UPDATE' || object.spec == oldObject.spec
      message: the CSI controller may relabel or annotate its engine pods, never change their spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: constellation-csi-controller-pods.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  policyName: constellation-csi-controller-pods.{{ .Release.Namespace }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
# The exec's command, in a policy of its own: matched on `pods/exec` only,
# `object` is the request's PodExecOptions (a policy matching `pods` too
# types `object` as a Pod, and `command` would not type-check).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: constellation-csi-controller-pods-exec.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CONNECT]
        resources: ["pods/exec"]
  matchConditions:
    - name: controller-service-account
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        object.?container.orValue('') == 'engine'
          && !object.?tty.orValue(false)
          && object.?command.orValue([]) in [
               [{{ $bin | quote }}, 'control-relay', '--socket', {{ $sock | quote }}],
               [{{ $bin | quote }}, 'control-relay', '--ping', '--socket', {{ $sock | quote }}]]
      message: >-
        the CSI controller only execs the control relay
        (`constellation control-relay [--ping] --socket …`) in an engine container
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: constellation-csi-controller-pods-exec.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  policyName: constellation-csi-controller-pods-exec.{{ .Release.Namespace }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- /*
Plan 37 §9, the node plugin's half (37-k3a). Its ServiceAccount creates,
patches and deletes this node's engine pods, from a privileged pod whose
token is therefore the one worth stealing: unrestricted, `pods` create in
this privileged namespace is root on every node, and `pods` delete takes
every mount in the cluster down. This policy holds every pod operation of
that ServiceAccount to node-owned engine pods (`constellation-engine-*`,
never a controller's `-controller` one) on the requester's own node —
CREATE by the new pod's nodeName, UPDATE and DELETE by the existing pod's
(bound tokens carry `authentication.kubernetes.io/node-name`; a token
without it is refused) — and no subresource at all (exec, attach,
eviction, status). A created pod is exactly the shape
crates/csi/src/engine_pods.rs builds: this chart's image, one engine
container running `constellation serve` (probes only `constellation
control-relay`), no init container (37-k6a: the plugin makes the unit's
directories owned by uid 65532 itself), uid 65532 under PodSecurity
`restricted`'s container rules, no host namespace, no runtime class, no
service-account token (and the token-less `constellation-csi-engine`
ServiceAccount), no environment from anywhere but literal values (the
credentials come by `fs.unlock`), and the volumes of one unit
(`constellation.replicix.com/unit`) only: <hostRoot>/{node-identity,sockets,policy}/
<unit> (type Directory: never created by kubelet) and a scratch emptyDir,
each at its own path, the policy one read-only (and the EKS webhooks'
projected token, as above).
*/}}
{{- if .Values.node.podAccessPolicy }}
{{- $sa := printf "system:serviceaccount:%s:constellation-csi-node" .Release.Namespace }}
{{- $root := trimSuffix "/" .Values.hostRoot }}
{{- $bin := "/usr/local/bin/constellation" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: constellation-csi-node-pods.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["pods", "pods/*"]
  matchConditions:
    - name: node-service-account
      expression: request.userInfo.username == {{ $sa | quote }}
  variables:
    - name: target
      expression: >-
        request.operation == 'CREATE' && request.?subResource.orValue('') == ''
          ? object.metadata.name : request.name
    - name: creating
      expression: request.operation == 'CREATE' && request.?subResource.orValue('') == ''
    - name: requesterNode
      expression: >-
        request.userInfo.?extra[?'authentication.kubernetes.io/node-name'].orValue([])
    - name: podNode
      expression: >-
        variables.creating
          ? object.spec.?nodeName.orValue('')
          : (oldObject == null ? '' : oldObject.spec.?nodeName.orValue(''))
    - name: unit
      expression: >-
        object.metadata.?labels[?'constellation.replicix.com/unit'].orValue('')
    - name: execOk
      # A probe's exec command, if any, is `constellation control-relay …`.
      expression: >-
        [object.spec.containers[0].?startupProbe, object.spec.containers[0].?readinessProbe,
         object.spec.containers[0].?livenessProbe].all(p,
          !p.hasValue() || !has(p.value().exec)
          || (size(p.value().exec.command) >= 2
              && p.value().exec.command[0] == {{ $bin | quote }}
              && p.value().exec.command[1] == 'control-relay'))
  validations:
    - expression: request.operation != 'CONNECT' && request.?subResource.orValue('') == ''
      message: the CSI node plugin never execs, attaches, evicts or touches a pod subresource
    - expression: >-
        variables.target.matches('^constellation-engine-[a-z0-9.-]+$')
          && !variables.target.endsWith('-controller')
      messageExpression: >-
        'the CSI node plugin may only touch its own engine pods
        (constellation-engine-<unit>-<node>), not ' + variables.target
    - expression: >-
        size(variables.requesterNode) == 1 && variables.podNode == variables.requesterNode[0]
      messageExpression: >-
        'a node plugin may only create, change or delete engine pods on its own node ('
        + (size(variables.requesterNode) == 1 ? variables.requesterNode[0]
           : 'its token names no node') + '), not on ' + variables.podNode
    - expression: >-
        !variables.creating || (
          has(object.metadata.labels)
          && object.metadata.labels[?'app.kubernetes.io/component'].orValue('') == 'engine'
          && object.metadata.labels[?'constellation.replicix.com/owner'].orValue('') == 'node'
          && variables.unit.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
          && !variables.unit.endsWith('-controller')
          && variables.target.startsWith('constellation-engine-' + variables.unit + '-'))
      message: >-
        an engine pod carries the engine/node labels and is named after its
        unit (constellation.replicix.com/unit)
    - expression: >-
        !variables.creating || (
          !object.spec.?hostNetwork.orValue(false)
          && !object.spec.?hostPID.orValue(false)
          && !object.spec.?hostIPC.orValue(false)
          && !has(object.spec.ephemeralContainers)
          && !has(object.spec.runtimeClassName)
          && object.spec.?automountServiceAccountToken.orValue(true) == false
          && object.spec.?serviceAccountName.orValue('') == 'constellation-csi-engine'
          && object.spec.?serviceAccount.orValue('constellation-csi-engine') == 'constellation-csi-engine'
          && object.spec.?securityContext.?runAsNonRoot.orValue(false)
          && object.spec.?securityContext.?runAsUser.orValue(0) == 65532)
      message: >-
        an engine pod uses no host namespace, no runtime class and no
        service-account token, runs as the constellation-csi-engine
        ServiceAccount and as uid 65532
    - expression: >-
        !variables.creating || (
          !has(object.spec.initContainers)
          && object.spec.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault'
          && object.spec.containers.all(c,
          c.image == {{ include "csi.image" . | quote }}
          && !c.?securityContext.?privileged.orValue(false)
          && c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false
          && c.?securityContext.?readOnlyRootFilesystem.orValue(false)
          && size(c.?securityContext.?capabilities.?add.orValue([])) == 0
          && c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL')
          && !has(c.lifecycle) && !has(c.envFrom)
          && c.?env.orValue([]).all(e, !has(e.valueFrom))
          && c.?volumeMounts.orValue([]).all(m,
               !has(m.subPath) && !has(m.subPathExpr)
               && m.?mountPropagation.orValue('None') == 'None'
               && ((m.name == 'node-identity' && m.mountPath == '/var/lib/constellation/state')
                   || (m.name == 'sockets' && m.mountPath == '/run/constellation-csi')
                   || (m.name == 'scratch' && m.mountPath == '/tmp')
                   || (m.name == 'policy' && m.mountPath == '/etc/constellation-csi/policy'
                       && m.?readOnly.orValue(false))
                   || {{ include "csi.awsTokenMount" . }}))))
      message: >-
        an engine pod has no init container and RuntimeDefault seccomp; its
        containers run this chart's image under PodSecurity restricted's
        rules (no capability, no privilege escalation, read-only root),
        without lifecycle hooks or environment from a Secret, and mount only
        the unit's volumes at their own paths (the policy read-only)
    - expression: >-
        !variables.creating || (
          size(object.spec.containers) == 1
          && object.spec.containers.all(c,
               c.?command.orValue([]) == [{{ $bin | quote }}]
               && size(c.?args.orValue([])) > 0 && c.args[0] == 'serve'
               && c.?securityContext.?runAsUser.orValue(65532) == 65532
               && !c.?securityContext.?capabilities.?add.hasValue())
          && variables.execOk)
      message: >-
        an engine pod has one container, running `constellation serve` as
        uid 65532 with no added capability, its probes `constellation control-relay`
    - expression: >-
        !variables.creating || object.spec.?volumes.orValue([]).all(v,
          (v.name == 'scratch' && has(v.emptyDir))
          || (v.name in ['node-identity', 'sockets', 'policy'] && has(v.hostPath)
              && v.hostPath.path == {{ $root | quote }} + '/' + v.name + '/' + variables.unit
              && v.hostPath.?type.orValue('') == 'Directory')
          || {{ include "csi.awsTokenVolume" . }})
      message: >-
        an engine pod's volumes are its unit's <hostRoot>/{node-identity,
        sockets,policy}/<unit> directories and a scratch emptyDir
    - expression: >-
        request.operation != 'UPDATE' || object.spec == oldObject.spec
      message: the CSI node plugin may annotate its engine pods, never change their spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: constellation-csi-node-pods.{{ .Release.Namespace }}
  labels: {{- include "csi.labels" . | nindent 4 }}
spec:
  policyName: constellation-csi-node-pods.{{ .Release.Namespace }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
