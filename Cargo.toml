[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/platform",
    "crates/vfs",
    "crates/engine",
    "crates/frontend-fuse",
    "crates/cli",
    "crates/fs-core",
    "crates/meta",
    "crates/mtree",
    "crates/store-s3",
    "crates/net",
    "crates/control",
    "crates/harness",
    "crates/chaos",
    "crates/upload-concurrency",
    "crates/model",
    "crates/authority",
    "bench/uploadbench",
]
# Bare `cargo build`/`cargo test` at the root only touch the product
# crates, matching the pre-bench-tool build set; `bench/uploadbench` is
# still a full member (shares the lockfile, reuses the real
# `constellation-upload-concurrency` crate) but only builds when asked
# for explicitly (`-p uploadbench`, `--workspace`, or `cd` + `cargo run`).
default-members = [
    "crates/types",
    "crates/platform",
    "crates/vfs",
    "crates/engine",
    "crates/frontend-fuse",
    "crates/cli",
    "crates/fs-core",
    "crates/meta",
    "crates/mtree",
    "crates/store-s3",
    "crates/net",
    "crates/control",
    "crates/harness",
    "crates/chaos",
    "crates/upload-concurrency",
    "crates/model",
    "crates/authority",
]
exclude = [
    "bench/dbbench",
    "bench/prollybench",
    "bench/enginebench",
    "vendor/fjall",
    "vendor/fuser",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/replicix/constellation"

[workspace.dependencies]
constellation-types = { path = "crates/types" }
constellation-platform = { path = "crates/platform" }
constellation-vfs = { path = "crates/vfs" }
constellation-engine = { path = "crates/engine" }
constellation-frontend-fuse = { path = "crates/frontend-fuse" }
constellation-fs-core = { path = "crates/fs-core" }
constellation-meta = { path = "crates/meta" }
constellation-mtree = { path = "crates/mtree" }
constellation-store-s3 = { path = "crates/store-s3" }
constellation-net = { path = "crates/net" }
constellation-control = { path = "crates/control" }
constellation-upload-concurrency = { path = "crates/upload-concurrency" }
constellation-chaos = { path = "crates/chaos" }
constellation-authority = { path = "crates/authority" }

anyhow = "1"
thiserror = "2"
blake3 = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
object_store = { version = "0.14", features = ["aws"] }
toml = "1"
# Default features include SSO + credentials-process — the same chain
# `aws` CLI / SDKs use for env vars, ~/.aws profiles, and SSO sessions.
aws-config = "1"
aws-credential-types = "1"
aws-types = "1"
clap = { version = "4", features = ["derive", "env"] }
fuser = { version = "0.18", default-features = false }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
rayon = "1"
tempfile = "3"
rand = "0.9"
memmap2 = "0.9"

# P2P fast path (M3.3): QUIC endpoint keyed by node pubkey plus a gossip
# topic for push invalidation and lease handoff.
iroh = "1"
iroh-gossip = "0.101"

# Vendored fjall 3.1.10 with a one-function fix for a shutdown deadlock in
# `DatabaseInner::drop`; see vendor/fjall/CONSTELLATION-PATCH.md for what
# it changes and how to drop it again once upstream ships a fix. Excluded
# from the workspace above so it is built as a plain dependency (not
# linted or tested as a member).
[patch.crates-io]
fjall = { path = "vendor/fjall" }
# Plan 31 C4b: FUSE session handover (vendor/fuser/CONSTELLATION-PATCH.md).
fuser = { path = "vendor/fuser" }

[profile.release]
lto = "thin"
strip = true
