[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/fs-core",
    "crates/meta",
    "crates/store-s3",
    "crates/net",
    "crates/api",
    "crates/harness",
]
exclude = ["bench/dbbench"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bra-fsn/constellation"

[workspace.dependencies]
constellation-fs-core = { path = "crates/fs-core" }
constellation-meta = { path = "crates/meta" }
constellation-store-s3 = { path = "crates/store-s3" }
constellation-net = { path = "crates/net" }
constellation-api = { path = "crates/api" }

anyhow = "1"
thiserror = "2"
blake3 = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
object_store = { version = "0.12", features = ["aws"] }
clap = { version = "4", features = ["derive", "env"] }
fuser = { version = "0.15", default-features = false }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tempfile = "3"
rand = "0.9"

[profile.release]
lto = "thin"
strip = true
