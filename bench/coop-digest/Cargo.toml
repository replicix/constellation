[package]
name = "coop-digest"
version = "0.1.0"
edition = "2021"
description = "Plan 47 P1: chunk-location digest candidates measured against the exact mirror"
publish = false

[dependencies]
constellation-net = { path = "../../crates/net" }
blake3 = { version = "=1.8.7", default-features = false }
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
qfilter = { version = "=0.3.1", default-features = false }
xorf = { version = "=0.13.0", default-features = false, features = ["binary-fuse"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

# The workspace patches netwatch with a vendored copy; a standalone crate
# does not inherit workspace patches, so repeat it to resolve the same tree.
[patch.crates-io]
netwatch = { path = "../../vendor/netwatch" }
